# CI for ai-shared-lib-public (the authority layer of the privacy guardrail).
# Runs the stdlib-only guardrail and the full test suite on every push/MR.
stages:
- guardrail
- test

privacy-guardrail:
  stage: guardrail
  image: python:3.12-slim
  script:
  - python3 scripts/check_privacy.py --root "$CI_PROJECT_DIR"

unit-tests:
  stage: test
  image: python:3.12-slim
  before_script:
  - pip install -e .
  script:
  - python -m unittest discover -s tests -p "test_*.py" -v

# Secret Detection (GitLab-managed, defence-in-depth alongside the guardrail's scan).
include:
- template: Security/Secret-Detection.gitlab-ci.yml
