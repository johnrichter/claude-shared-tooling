[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-shared-lib-public"
version = "0.1.0"
description = "Public, dependency-free shared tools and schemas for AI-agent workspaces (git commit re-signing, sitemap parsing, article-metadata extraction)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
# License: TODO — pick per the org OSS-licensing policy before any external publish.

[project.scripts]
jr-resign-commits = "ai_shared_lib_public.resign_commits:main"
jr-sitemap-parser = "ai_shared_lib_public.sitemap_parser:main"
jr-article-meta = "ai_shared_lib_public.article_meta:main"

[tool.setuptools]
packages = ["ai_shared_lib_public"]
