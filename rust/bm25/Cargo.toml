[package]
name = "bm25"
version = "0.1.0"
edition = "2021"
description = "General-purpose, call-time-customizable BM25 ranking library — deterministic, no ML."
license = "MIT"
publish = false

[dependencies]
# Pure-Rust deps only (no CGO/C) so the crate stays musl-static-buildable.
# regex: whole-identifier tokenizer (M1.P1.T2); reused by the case-splitting
# tokenizer mode (M1.P2.T2).
regex = "1"

[dev-dependencies]

[lints]
workspace = true
