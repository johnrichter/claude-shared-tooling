[package]
name = "frontmatter"
version = "0.1.0"
edition = "2021"
description = "Frontmatter parsing for navigator — one YAML-frontmatter-plus-Markdown-body parser producing a parser-agnostic, order-preserving result."
license = "MIT"
publish = false

[dependencies]
# M2.P2.T1a (operator-approved: MIT OR Apache-2.0, pure-Rust, no CGO,
# musl-fine): pure-Rust, strict YAML 1.2 DOM parser. Loaded via
# `YamlLoader`/`Yaml`, which returns `Result` (never panics on malformed
# input) and preserves mapping insertion order via `hashlink::LinkedHashMap`
# -- both properties this crate's no-panic and determinism contracts need.
# `Yaml` itself never leaks past `crate::parse`: the public
# `ParsedFrontmatter`/`FrontmatterValue` types own no yaml-rust2 type, so the
# backend is swappable later without a breaking change to consumers.
yaml-rust2 = "0.11.0"
# M2.P2.T1b (operator-approved: MIT OR Apache-2.0, pure-Rust, no CGO,
# musl-fine, ubiquitous/standard): deserializes the declarative frontmatter
# schema (core profile + extension pack, both plain JSON) into `validate`'s
# `Profile` type. `derive` generates the field-by-field `Deserialize` impls
# so the schema's JSON shape and the Rust struct shape stay one definition
# each, not hand-kept in sync.
serde = { version = "1.0.228", features = ["derive"] }
# Paired with `serde` above: the schema files are JSON, so this is the
# natural decoder. Also used to embed the bundled core/psa-apm profiles via
# `include_str!` + `serde_json::from_str`, so the crate's own tests and the
# psa-apm default validate with zero filesystem reads.
serde_json = "1.0.150"
# M2.P2.T1b finalization (operator-approved, replacing a hand-rolled
# restricted-subset matcher): compiles the pack's `report.period.regex`
# into a real `regex::Regex`, once, at `Profile` construction
# (`profile::Profile::period_pattern`) -- see that module for why `[0-9]`
# (not `\d`) is used in the shipped pattern.
regex = "1.13.0"
# M2.P2.T1b finalization (operator-approved, replacing a hand-rolled
# `fnmatch`-style matcher): compiles the pack's `file_class` rule globs and
# `exempt.path_globs` into `GlobSet`s, once, at `Profile` construction
# (`profile::CompiledGlobs`) -- `literal_separator` left at its default
# (`false`) so `*` crosses `/`, matching Python `fnmatch.fnmatch` parity.
globset = "0.4.18"
# Operator-approved (see facetquery's Cargo.toml for the full rationale):
# dual MIT/Apache-2.0, actively maintained, pure-Rust civil-calendar-date
# type. `validate`'s `report_period_format` phase uses it to calendar-check
# a shape-valid `period:` tag's two endpoints (real month/day, real leap
# year, start <= end) -- a real-calendar gate the shape regex alone can't
# express. `parsing` + `macros` only, `default-features = false`: no
# clock/`now`, matching this crate's pure, deterministic validation
# contract.
time = { version = "0.3.53", default-features = false, features = ["parsing", "macros"] }
# Workspace path dependency (facetquery <- frontmatter, per the crate
# boundary doc): the `query` module bridges `ParsedFrontmatter` + `Profile`
# to facetquery's generic `FacetSource` trait, so a caller parses a
# `facetquery@1` query once and matches it against many frontmatter files.
facetquery = { path = "../facetquery" }

[dev-dependencies]

[lints]
workspace = true
