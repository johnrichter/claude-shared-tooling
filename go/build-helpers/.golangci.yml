# golangci-lint v2 config. Version pin lives in CI (ci.yml `version: v2.12.2`) and locally
# via `go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2` — this file
# only pins the *config schema* version golangci-lint must parse it as.
version: "2"

linters:
  default: standard

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
