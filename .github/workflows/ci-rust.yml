# Reusable CI template — Rust track. Implements the fleet CI template contract
# (docs/ci-template-contract.md): a source-checks job (format, lint, vet, security — one
# platform, since those checks read source text or the dependency graph rather than build
# output) and a build-test job (build, test unit, test e2e, test benchmark — the
# four-platform matrix, needs: source-checks). The checkout, platform-resolution and
# verified-fetch steps for mise and language-tools are byte-for-byte shared with ci-go.yml
# and ci-python.yml; a change to that shared shape belongs in ci-go.yml first, then copies
# here. Rust's own toolchain activation and check-tool provisioning differ from Go's and
# Python's, per the contract, and are documented inline below.
#
# Toolchain activation (contract section 4). mise.lock's `core:rust` row records a version
# and no digest (F60) — unlike the per-platform url+sha256 rows Go and Python record, so
# this template's toolchain step has no digest to verify against and says so rather than
# implying one. `MISE_RUSTUP_HOME`/`MISE_CARGO_HOME`, set on the `mise install --locked`
# step, make mise bootstrap its own isolated rustup rather than reuse or mutate the
# runner's ambient one (F62). Because a rustup-managed cargo is a proxy that reads
# `RUSTUP_TOOLCHAIN` to select a toolchain and `RUSTUP_HOME` to find it, that step persists
# mise's resolved selection (both homes plus `RUSTUP_TOOLCHAIN`) to `GITHUB_ENV`, not just
# `bin-paths` to PATH — otherwise a later step's bare cargo resolves the runner's ambient
# default rather than the pin. That resolve+install+activate sequence is the two activation
# stages Rust carries (OD16). Cargo is absent from the `ubuntu-24.04` toolcache (F55b), so
# there is no third stage here and none is implied.
#
# Check-tool provisioning (contract section 5): cargo-audit, cargo-deny, cargo-nextest and
# cargo-llvm-cov — the Rust share of F54's 23-binary matrix — install from a template-owned
# mise config written to RUNNER_TEMP and pointed at via MISE_CONFIG_FILE, never the
# caller's own committed mise.toml/mise.lock. Each is pinned at its latest stable version
# (OD49). cargo-deny and cargo-llvm-cov resolve through the aqua backend, which records a
# per-platform digest; cargo-audit and cargo-nextest resolve through the cargo backend,
# which records none (F67 measures 0 entries on that backend) — the digest check is simply
# not run for those two, per the contract.
#
# Inputs:
#   runs_on                          (string,  default "ubuntu-24.04")
#     Fully qualified GitHub-hosted runner label, published by actions/runner-images.
#     Never a floating tag (ubuntu-latest, ...): those move under a caller without notice.
#     Unused by this template's own job placement — source-checks and build-test fix their
#     runner labels per the two-job shape (section 3) — kept for input-naming parity with
#     the other five templates (section 1).
#   crate_dir                        (string,  default ".")
#     Rust crate directory language-tools checks, relative to the checked-out repo
#     (language-tools' `--dir`).
#   mise_version                     (string,  default "2026.9.1")
#     mise release this template installs. Latest stable patch, measured at write time
#     per K11/S7 — never carried forward from an earlier revision. Every committed
#     mise.lock must be re-locked with this version.
#   dry_run                          (boolean, default false)
#     true installs and verifies mise, language-tools and the Rust check binaries, then
#     stops — every check step and extra_steps are skipped. Proves the call contract and
#     the installs without needing the caller's code to actually pass a check.
#   test_timeout                     (number,  default 300)
#     Wall-clock bound per test subcommand, in seconds. Applied to each `test` subcommand
#     step as `--timeout <n>s`. Default is language-tools' own binary default (300 s).
#   extra_steps                      (string,  default "")
#     Shell script run after build-test's checks, for a repository-specific check
#     language-tools doesn't cover (e.g. a shellcheck run, a GPG-signing smoke test).
#     Empty runs nothing.
#
# Caller contract: the caller supplies nothing but these inputs — this template checks out
# the caller's own repo itself, at repo root, once per job. claude-shared-tooling is a
# public repository (F78), so a caller's Cargo.toml resolves it like any other dependency
# (SC9 already removed the `[patch]` entry the sibling checkout used to serve); this
# template takes no sibling-checkout input, no private-module coupling, and needs no
# secret. It pushes and publishes nothing.

name: CI template (Rust)

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Fully qualified GitHub-hosted runner label (actions/runner-images). Never a floating tag. Unused for this template's own job placement (source-checks/build-test fix their labels); kept for input-naming parity with the other five templates."
        required: false
        type: string
        default: "ubuntu-24.04"
      crate_dir:
        description: "Rust crate directory language-tools checks, relative to the checked-out repo."
        required: false
        type: string
        default: "."
      mise_version:
        description: "mise release the template installs. Latest stable patch, measured at write time per K11/S7. Every committed mise.lock must be re-locked with this version."
        required: false
        type: string
        default: "2026.9.1"
      dry_run:
        description: "true installs and verifies mise, language-tools and the Rust check binaries, then stops; every check step and extra_steps are skipped."
        required: false
        type: boolean
        default: false
      test_timeout:
        description: "Wall-clock bound per test subcommand, in seconds. Applied as language-tools --timeout <n>s. Default is the binary default (300 s)."
        required: false
        type: number
        default: 300
      extra_steps:
        description: "Shell script run after build-test's checks, for a repository-specific check language-tools doesn't cover. Empty runs nothing."
        required: false
        type: string
        default: ""

env:
  # Named once; every step below reads this instead of restating the version.
  # 3.0.3 patch-bumps 3.0.2 (both patch OD69's 3.0.0 major bump, SC5: --language became a required selector on `release build`); 3.0.3 adds the go/toolchain python pytest vacuous-pass fix (a zero-collection run passes) atop 3.0.2's rust test-filterset and in-process failure-path capture fixes.
  LANGUAGE_TOOLS_VERSION: "3.0.3"

permissions:
  contents: read

jobs:
  source-checks:
    name: source-checks
    runs-on: ubuntu-24.04-arm        # OD63: one platform, source text not build output
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # mise and language-tools name platforms differently (mise: linux/macos, x64/arm64;
      # language-tools: Go's own linux/darwin, amd64/arm64) — resolve both once, here.
      - name: Resolve runner platform
        id: platform
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          case "$(uname -s)" in
            Linux)  mise_os=linux;  lt_os=linux  ;;
            Darwin) mise_os=macos;  lt_os=darwin ;;
            *) echo "::error::unsupported runner OS $(uname -s)"; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64)  mise_arch=x64;   lt_arch=amd64 ;;
            arm64|aarch64) mise_arch=arm64; lt_arch=arm64 ;;
            *) echo "::error::unsupported runner arch $(uname -m)"; exit 1 ;;
          esac
          {
            echo "mise_os=${mise_os}"
            echo "mise_arch=${mise_arch}"
            echo "lt_os=${lt_os}"
            echo "lt_arch=${lt_arch}"
          } >> "$GITHUB_OUTPUT"

      # Verified fetch (SC1 shape): fetch the release's own published checksum manifest,
      # look up this artifact's digest by exact filename match, then fetch the artifact and
      # fail closed on any mismatch. Never pipes a download into a shell.
      - name: Install mise ${{ inputs.mise_version }} (verified fetch)
        env:
          MISE_VERSION: ${{ inputs.mise_version }}
          MISE_OS: ${{ steps.platform.outputs.mise_os }}
          MISE_ARCH: ${{ steps.platform.outputs.mise_arch }}
        run: |
          set -euo pipefail
          bin="mise-v${MISE_VERSION}-${MISE_OS}-${MISE_ARCH}"
          base="https://github.com/jdx/mise/releases/download/v${MISE_VERSION}"
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/SHASUMS256.txt" "${base}/SHASUMS256.txt"
          curl -fsSL -o "${tmp}/${bin}" "${base}/${bin}"
          expected="$(awk -v want="./${bin}" '$2 == want { print $1; exit }' "${tmp}/SHASUMS256.txt")"
          if [ -z "${expected}" ]; then
            echo "::error::${bin} not listed in SHASUMS256.txt for mise v${MISE_VERSION}"
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${tmp}/${bin}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "${tmp}/${bin}" | awk '{print $1}')"
          fi
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::sha256 mismatch for ${bin} -- expected ${expected}, got ${actual}"
            exit 1
          fi
          install -m 0755 "${tmp}/${bin}" "${RUNNER_TEMP}/bin/mise"
          rm -rf "${tmp}"

      # Trust every config mise will read before the first check reads one (OD65, F58).
      # mise refuses an untrusted config outright; an untrusted file breaks every check.
      - name: mise trust
        run: mise trust --all

      # Install the pinned toolchain, then put mise's shims ahead of the ambient runner
      # version on PATH (F55, F56). MISE_PYTHON_COMPILE=0 is harmless for Rust; set on every
      # template for one shared activation shape. MISE_RUSTUP_HOME/MISE_CARGO_HOME make mise
      # bootstrap its own isolated rustup rather than reuse the runner's ambient one (F62,
      # OD16 stage two) — Rust carries no third stage (F55b: Cargo is absent from the
      # ubuntu-24.04 toolcache), so this and the resolve step above are the two stages it gets.
      - name: mise install --locked
        env:
          # aqua:/ubi: metadata resolves through api.github.com; the job token buys the
          # authenticated per-repo quota instead of the shared-IP 60/hr anonymous one (F-T12-1).
          GITHUB_TOKEN: ${{ github.token }}
          MISE_PYTHON_COMPILE: "0"
          MISE_RUSTUP_HOME: ${{ runner.temp }}/rustup
          MISE_CARGO_HOME: ${{ runner.temp }}/cargo
        run: |
          set -euo pipefail
          mise install --locked
          mise bin-paths >> "$GITHUB_PATH"
          # A rustup-managed cargo is a proxy that reads RUSTUP_TOOLCHAIN to pick a toolchain
          # and RUSTUP_HOME to find it; `mise bin-paths` puts that proxy on PATH but sets
          # neither, so a bare cargo in a later step resolves the runner's ambient default
          # instead of the pin (the SC6 breach F56 guards against). Persist mise's own resolved
          # values — never a hardcoded version — so every later step's cargo is the pin.
          mise env --dotenv | grep -E '^(RUSTUP_HOME|CARGO_HOME|RUSTUP_TOOLCHAIN)=' >> "$GITHUB_ENV"

      # SC6: prove the pin, not the ambient runner Cargo (F56 measures Cargo 1.97.1 ambient).
      # The core:rust lock row carries no digest to verify (F60) — this printed version is
      # the reader's proof, not a checksum match.
      - name: Resolved Rust toolchain version
        run: cargo --version

      # SC7: cargo-deny resolves through the aqua backend (per-platform digest recorded);
      # cargo-audit resolves through the cargo backend (no digest, F67 measures 0 entries on
      # that backend) — the digest check is simply not run for it. Installed from a
      # template-owned config so the caller's own committed mise.toml/mise.lock is never
      # touched.
      - name: Provision Rust check binaries (cargo-audit, cargo-deny)
        env:
          # aqua:/ubi: metadata resolves through api.github.com; the job token buys the
          # authenticated per-repo quota instead of the shared-IP 60/hr anonymous one (F-T12-1).
          GITHUB_TOKEN: ${{ github.token }}
          MISE_CONFIG_FILE: ${{ runner.temp }}/rust-source-check-tools.toml
        run: |
          set -euo pipefail
          cat > "${MISE_CONFIG_FILE}" <<'EOF'
          [tools]
          "cargo:cargo-audit" = "0.22.2"
          "aqua:EmbarkStudios/cargo-deny" = "0.20.2"
          EOF
          mise trust "${MISE_CONFIG_FILE}"
          mise install
          mise bin-paths >> "$GITHUB_PATH"

      - name: Installed check-tool versions (OD60)
        run: |
          set -euo pipefail
          cargo audit --version
          cargo deny --version

      - name: Install language-tools ${{ env.LANGUAGE_TOOLS_VERSION }} (verified fetch)
        env:
          LT_OS: ${{ steps.platform.outputs.lt_os }}
          LT_ARCH: ${{ steps.platform.outputs.lt_arch }}
        run: |
          set -euo pipefail
          archive="language-tools_${LANGUAGE_TOOLS_VERSION}_${LT_OS}_${LT_ARCH}.tar.gz"
          base="https://github.com/johnrichter/language-tools/releases/download/v${LANGUAGE_TOOLS_VERSION}"
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/checksums.txt" "${base}/checksums.txt"
          curl -fsSL -o "${tmp}/${archive}" "${base}/${archive}"
          expected="$(awk -v want="${archive}" '$2 == want { print $1; exit }' "${tmp}/checksums.txt")"
          if [ -z "${expected}" ]; then
            echo "::error::${archive} not listed in checksums.txt for language-tools v${LANGUAGE_TOOLS_VERSION}"
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${tmp}/${archive}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "${tmp}/${archive}" | awk '{print $1}')"
          fi
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::sha256 mismatch for ${archive} -- expected ${expected}, got ${actual}"
            exit 1
          fi
          tar -xzf "${tmp}/${archive}" -C "${tmp}"
          install -m 0755 "${tmp}/language-tools" "${RUNNER_TEMP}/bin/language-tools"
          rm -rf "${tmp}"

      - name: Dry-run summary (installs verified, checks skipped)
        if: ${{ inputs.dry_run }}
        run: echo "dry-run summary -- mise ${{ inputs.mise_version }}, language-tools ${{ env.LANGUAGE_TOOLS_VERSION }} and cargo-audit/cargo-deny installed and verified, the source-checks steps are skipped"

      - name: language-tools format
        if: ${{ !inputs.dry_run }}
        run: language-tools format --language rust --dir "${{ inputs.crate_dir }}" --log-dir "${{ github.workspace }}/.language-tools/log"

      - name: language-tools lint
        if: ${{ !inputs.dry_run }}
        run: language-tools lint --language rust --dir "${{ inputs.crate_dir }}" --log-dir "${{ github.workspace }}/.language-tools/log"

      - name: language-tools vet
        if: ${{ !inputs.dry_run }}
        run: language-tools vet --language rust --dir "${{ inputs.crate_dir }}" --log-dir "${{ github.workspace }}/.language-tools/log"

      - name: language-tools security
        if: ${{ !inputs.dry_run }}
        run: language-tools security --language rust --dir "${{ inputs.crate_dir }}" --log-dir "${{ github.workspace }}/.language-tools/log"

      # Failure-path capture (contract section 10): export the per-check records a
      # failed check wrote under .language-tools/log so a gate_negative.toolchain.error
      # travels with the run instead of needing a local re-probe. Changes no check's
      # invocation, target root, subject set or verdict.
      - name: Capture language-tools logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: language-tools-logs-rust-source-checks
          path: ${{ github.workspace }}/.language-tools/log/
          if-no-files-found: ignore

  build-test:
    name: build-test
    needs: source-checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve runner platform
        id: platform
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          case "$(uname -s)" in
            Linux)  mise_os=linux;  lt_os=linux  ;;
            Darwin) mise_os=macos;  lt_os=darwin ;;
            *) echo "::error::unsupported runner OS $(uname -s)"; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64)  mise_arch=x64;   lt_arch=amd64 ;;
            arm64|aarch64) mise_arch=arm64; lt_arch=arm64 ;;
            *) echo "::error::unsupported runner arch $(uname -m)"; exit 1 ;;
          esac
          {
            echo "mise_os=${mise_os}"
            echo "mise_arch=${mise_arch}"
            echo "lt_os=${lt_os}"
            echo "lt_arch=${lt_arch}"
          } >> "$GITHUB_OUTPUT"

      - name: Install mise ${{ inputs.mise_version }} (verified fetch)
        env:
          MISE_VERSION: ${{ inputs.mise_version }}
          MISE_OS: ${{ steps.platform.outputs.mise_os }}
          MISE_ARCH: ${{ steps.platform.outputs.mise_arch }}
        run: |
          set -euo pipefail
          bin="mise-v${MISE_VERSION}-${MISE_OS}-${MISE_ARCH}"
          base="https://github.com/jdx/mise/releases/download/v${MISE_VERSION}"
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/SHASUMS256.txt" "${base}/SHASUMS256.txt"
          curl -fsSL -o "${tmp}/${bin}" "${base}/${bin}"
          expected="$(awk -v want="./${bin}" '$2 == want { print $1; exit }' "${tmp}/SHASUMS256.txt")"
          if [ -z "${expected}" ]; then
            echo "::error::${bin} not listed in SHASUMS256.txt for mise v${MISE_VERSION}"
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${tmp}/${bin}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "${tmp}/${bin}" | awk '{print $1}')"
          fi
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::sha256 mismatch for ${bin} -- expected ${expected}, got ${actual}"
            exit 1
          fi
          install -m 0755 "${tmp}/${bin}" "${RUNNER_TEMP}/bin/mise"
          rm -rf "${tmp}"

      - name: mise trust
        run: mise trust --all

      - name: mise install --locked
        env:
          # aqua:/ubi: metadata resolves through api.github.com; the job token buys the
          # authenticated per-repo quota instead of the shared-IP 60/hr anonymous one (F-T12-1).
          GITHUB_TOKEN: ${{ github.token }}
          MISE_PYTHON_COMPILE: "0"
          MISE_RUSTUP_HOME: ${{ runner.temp }}/rustup
          MISE_CARGO_HOME: ${{ runner.temp }}/cargo
        run: |
          set -euo pipefail
          mise install --locked
          mise bin-paths >> "$GITHUB_PATH"
          # A rustup-managed cargo is a proxy that reads RUSTUP_TOOLCHAIN to pick a toolchain
          # and RUSTUP_HOME to find it; `mise bin-paths` puts that proxy on PATH but sets
          # neither, so a bare cargo in a later step resolves the runner's ambient default
          # instead of the pin (the SC6 breach F56 guards against). Persist mise's own resolved
          # values — never a hardcoded version — so every later step's cargo is the pin.
          mise env --dotenv | grep -E '^(RUSTUP_HOME|CARGO_HOME|RUSTUP_TOOLCHAIN)=' >> "$GITHUB_ENV"

      - name: Resolved Rust toolchain version
        run: cargo --version

      # SC7: cargo-llvm-cov resolves through the aqua backend (per-platform digest recorded);
      # cargo-nextest resolves through the cargo backend (no digest, F67 measures 0 entries
      # on that backend) — the digest check is simply not run for it.
      - name: Provision Rust check binaries (cargo-nextest, cargo-llvm-cov)
        env:
          # aqua:/ubi: metadata resolves through api.github.com; the job token buys the
          # authenticated per-repo quota instead of the shared-IP 60/hr anonymous one (F-T12-1).
          GITHUB_TOKEN: ${{ github.token }}
          MISE_CONFIG_FILE: ${{ runner.temp }}/rust-build-test-tools.toml
        run: |
          set -euo pipefail
          cat > "${MISE_CONFIG_FILE}" <<'EOF'
          [tools]
          "cargo:cargo-nextest" = "0.9.140"
          "aqua:taiki-e/cargo-llvm-cov" = "0.8.7"
          EOF
          mise trust "${MISE_CONFIG_FILE}"
          mise install
          mise bin-paths >> "$GITHUB_PATH"

      - name: Installed check-tool versions (OD60)
        run: |
          set -euo pipefail
          cargo nextest --version
          cargo llvm-cov --version

      - name: Install language-tools ${{ env.LANGUAGE_TOOLS_VERSION }} (verified fetch)
        env:
          LT_OS: ${{ steps.platform.outputs.lt_os }}
          LT_ARCH: ${{ steps.platform.outputs.lt_arch }}
        run: |
          set -euo pipefail
          archive="language-tools_${LANGUAGE_TOOLS_VERSION}_${LT_OS}_${LT_ARCH}.tar.gz"
          base="https://github.com/johnrichter/language-tools/releases/download/v${LANGUAGE_TOOLS_VERSION}"
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/checksums.txt" "${base}/checksums.txt"
          curl -fsSL -o "${tmp}/${archive}" "${base}/${archive}"
          expected="$(awk -v want="${archive}" '$2 == want { print $1; exit }' "${tmp}/checksums.txt")"
          if [ -z "${expected}" ]; then
            echo "::error::${archive} not listed in checksums.txt for language-tools v${LANGUAGE_TOOLS_VERSION}"
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${tmp}/${archive}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "${tmp}/${archive}" | awk '{print $1}')"
          fi
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::sha256 mismatch for ${archive} -- expected ${expected}, got ${actual}"
            exit 1
          fi
          tar -xzf "${tmp}/${archive}" -C "${tmp}"
          install -m 0755 "${tmp}/language-tools" "${RUNNER_TEMP}/bin/language-tools"
          rm -rf "${tmp}"

      - name: Dry-run summary (installs verified, checks skipped)
        if: ${{ inputs.dry_run }}
        run: echo "dry-run summary -- mise ${{ inputs.mise_version }}, language-tools ${{ env.LANGUAGE_TOOLS_VERSION }} and cargo-nextest/cargo-llvm-cov installed and verified, the build-test steps and extra_steps are skipped"

      - name: language-tools build
        if: ${{ !inputs.dry_run }}
        run: language-tools build --language rust --dir "${{ inputs.crate_dir }}" --log-dir "${{ github.workspace }}/.language-tools/log"

      - name: language-tools test unit
        if: ${{ !inputs.dry_run }}
        run: language-tools test unit --language rust --dir "${{ inputs.crate_dir }}" --log-dir "${{ github.workspace }}/.language-tools/log" --timeout "${{ inputs.test_timeout }}s"

      - name: language-tools test e2e
        if: ${{ !inputs.dry_run }}
        run: language-tools test e2e --language rust --dir "${{ inputs.crate_dir }}" --log-dir "${{ github.workspace }}/.language-tools/log" --timeout "${{ inputs.test_timeout }}s"

      # OD53: test benchmark stays on the same four-platform matrix as build and the other
      # test subcommands, deliberately, rather than collapsing to one canonical platform.
      # Three signals only the full matrix catches: a bench target that fails to compile on
      # one platform/arch, a bench binary that panics only there, and one that hangs past
      # --timeout only there. The check's contract is compile-and-execute-cleanly — no timing
      # data is parsed or compared, so this is never a performance-regression gate.
      - name: language-tools test benchmark
        if: ${{ !inputs.dry_run }}
        run: language-tools test benchmark --language rust --dir "${{ inputs.crate_dir }}" --log-dir "${{ github.workspace }}/.language-tools/log" --timeout "${{ inputs.test_timeout }}s"

      - name: Extra steps (repository-specific checks language-tools doesn't cover)
        if: ${{ !inputs.dry_run && inputs.extra_steps != '' }}
        run: ${{ inputs.extra_steps }}

      # Failure-path capture (contract section 10). Matrix-scoped artifact name.
      - name: Capture language-tools logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: language-tools-logs-rust-build-test-${{ matrix.os }}
          path: ${{ github.workspace }}/.language-tools/log/
          if-no-files-found: ignore
