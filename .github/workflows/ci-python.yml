# Reusable CI template — Python track. Implements the fleet CI template contract
# (docs/ci-template-contract.md): a source-checks job (format, lint, vet, security — one
# platform, since those checks read source text rather than build output) and a build-test
# job (build, test unit, test e2e — the four-platform matrix, needs: source-checks). The
# checkout, platform-resolution and verified-fetch steps for mise and language-tools are
# byte-for-byte shared with ci-go.yml and ci-rust.yml; a change to that shared shape belongs
# in ci-go.yml first, then copies here. It reads nothing from the caller beyond mise.toml +
# mise.lock at the checked-out repo root and pyproject.toml at `project_dir`; every other
# decision is a typed input.
#
# Toolchain activation (contract section 4, OD17). The shared primary path — resolve
# platform, mise trust, `mise install --locked` with the pinned toolchain's bin paths
# prepended to PATH — is the same activation Go and Rust use, but F53 measures three of five
# Python checks still failing, three different ways, when only that primary path runs.
# actions/setup-python resolves Python 3.14.7 from the `ubuntu-24.04` toolcache (F55b) as a
# third activation stage, placed after the primary path so every check afterward runs against
# the pin rather than F56's ambient 3.12.3 — without moving the pin itself: 3.14.7 is exactly
# what mise.lock already pins. A step prints the resolved version so a reader can tell the two
# apart. Neither Go nor Rust needs this third stage (OD16).
#
# The mise install step below sets MISE_PYTHON_COMPILE=0. An ambient [settings.python]
# compile = true makes mise resolve a source-build asset instead of the committed
# python-build-standalone url+sha256 pin, and that source build breaks `mise install
# --locked`, which expects the pinned pre-built asset. Neither MISE_GLOBAL_CONFIG_FILE
# nor XDG_CONFIG_HOME suppresses that setting on mise 2026.8.10 — only the env var does,
# so it's set on this one step rather than assumed away by config isolation.
#
# Check-tool provisioning (contract section 5): ruff, mypy, bandit and (build-test's test e2e
# leg) playwright — the Python share of F54's 23-binary matrix — install from a
# template-owned mise config written to RUNNER_TEMP and pointed at via MISE_CONFIG_FILE,
# never the caller's own committed mise.toml/mise.lock. Each is pinned at its latest stable
# version (OD49). ruff resolves through the aqua backend, which records a per-platform
# digest; mypy, bandit and playwright resolve through the pipx backend, which records none
# (F67 measures 0 entries on that backend) — the digest check is simply not run for those
# three. playwright ships its own Chromium (OD61, F77 measures the runner images' own Chrome
# going unused), so the test e2e leg installs no browser.
#
# Inputs:
#   runs_on                          (string,  default "ubuntu-24.04")
#     Fully qualified GitHub-hosted runner label, published by actions/runner-images.
#     Never a floating tag (ubuntu-latest, ...): those move under a caller without notice.
#     Unused by this template's own job placement — source-checks and build-test fix their
#     runner labels per the two-job shape (section 3) — kept for input-naming parity with
#     the other five templates (section 1).
#   project_dir                      (string,  default ".")
#     Python project directory language-tools checks, relative to the checked-out repo
#     (language-tools' `--dir`).
#   mise_version                     (string,  default "2026.9.1")
#     mise release this template installs. Latest stable patch, measured at write time
#     per K11/S7 — never carried forward from an earlier revision. Every committed
#     mise.lock must be re-locked with this version.
#   dry_run                          (boolean, default false)
#     true installs and verifies mise, language-tools, ruff, mypy, bandit and (in build-test)
#     playwright, then stops — every check step and extra_steps are skipped. Proves the call
#     contract and the installs without needing the caller's code to actually pass a check.
#   test_timeout                     (number,  default 300)
#     Wall-clock bound per test subcommand, in seconds. Applied to each `test` subcommand
#     step as `--timeout <n>s`. Default is language-tools' own binary default (300 s).
#   extra_steps                      (string,  default "")
#     Shell script run after build-test's checks, for a repository-specific check
#     language-tools doesn't cover (e.g. a shellcheck run, a GPG-signing smoke test).
#     Empty runs nothing.
#
# Caller contract: the caller supplies nothing but these inputs — this template checks out
# the caller's own repo itself, at repo root, once per job. Python has no cross-repository
# sibling coupling the way Go's replace directive or Rust's [patch] entry do (no local path
# or private-index dependency on this repo), so this template takes neither a
# sibling-checkout input nor a GOPRIVATE-equivalent, and needs no secret. It pushes and
# publishes nothing.

name: CI template (Python)

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Fully qualified GitHub-hosted runner label (actions/runner-images). Never a floating tag. Unused for this template's own job placement (source-checks/build-test fix their labels); kept for input-naming parity with the other five templates."
        required: false
        type: string
        default: "ubuntu-24.04"
      project_dir:
        description: "Python project directory language-tools checks, relative to the checked-out repo."
        required: false
        type: string
        default: "."
      mise_version:
        description: "mise release the template installs. Latest stable patch, measured at write time per K11/S7. Every committed mise.lock must be re-locked with this version."
        required: false
        type: string
        default: "2026.9.1"
      dry_run:
        description: "true installs and verifies mise, language-tools, ruff, mypy, bandit and (build-test) playwright, then stops; every check step and extra_steps are skipped."
        required: false
        type: boolean
        default: false
      test_timeout:
        description: "Wall-clock bound per test subcommand, in seconds. Applied as language-tools --timeout <n>s. Default is the binary default (300 s)."
        required: false
        type: number
        default: 300
      extra_steps:
        description: "Shell script run after build-test's checks, for a repository-specific check language-tools doesn't cover. Empty runs nothing."
        required: false
        type: string
        default: ""

env:
  # Named once; every step below reads this instead of restating the version.
  # 3.0.3 patch-bumps 3.0.2 (both patch OD69's 3.0.0 major bump, SC5: --language became a required selector on `release build`); 3.0.3 adds the go/toolchain python pytest vacuous-pass fix (a zero-collection run passes) atop 3.0.2's rust test-filterset and in-process failure-path capture fixes.
  LANGUAGE_TOOLS_VERSION: "3.0.3"

permissions:
  contents: read

jobs:
  source-checks:
    name: source-checks
    runs-on: ubuntu-24.04-arm        # OD63: one platform, source text not build output
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # mise and language-tools name platforms differently (mise: linux/macos, x64/arm64;
      # language-tools: Go's own linux/darwin, amd64/arm64) — resolve both once, here.
      - name: Resolve runner platform
        id: platform
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          case "$(uname -s)" in
            Linux)  mise_os=linux;  lt_os=linux  ;;
            Darwin) mise_os=macos;  lt_os=darwin ;;
            *) echo "::error::unsupported runner OS $(uname -s)"; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64)  mise_arch=x64;   lt_arch=amd64 ;;
            arm64|aarch64) mise_arch=arm64; lt_arch=arm64 ;;
            *) echo "::error::unsupported runner arch $(uname -m)"; exit 1 ;;
          esac
          {
            echo "mise_os=${mise_os}"
            echo "mise_arch=${mise_arch}"
            echo "lt_os=${lt_os}"
            echo "lt_arch=${lt_arch}"
          } >> "$GITHUB_OUTPUT"

      # Verified fetch (SC1 shape): fetch the release's own published checksum manifest,
      # look up this artifact's digest by exact filename match, then fetch the artifact and
      # fail closed on any mismatch. Never pipes a download into a shell.
      - name: Install mise ${{ inputs.mise_version }} (verified fetch)
        env:
          MISE_VERSION: ${{ inputs.mise_version }}
          MISE_OS: ${{ steps.platform.outputs.mise_os }}
          MISE_ARCH: ${{ steps.platform.outputs.mise_arch }}
        run: |
          set -euo pipefail
          bin="mise-v${MISE_VERSION}-${MISE_OS}-${MISE_ARCH}"
          base="https://github.com/jdx/mise/releases/download/v${MISE_VERSION}"
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/SHASUMS256.txt" "${base}/SHASUMS256.txt"
          curl -fsSL -o "${tmp}/${bin}" "${base}/${bin}"
          expected="$(awk -v want="./${bin}" '$2 == want { print $1; exit }' "${tmp}/SHASUMS256.txt")"
          if [ -z "${expected}" ]; then
            echo "::error::${bin} not listed in SHASUMS256.txt for mise v${MISE_VERSION}"
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${tmp}/${bin}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "${tmp}/${bin}" | awk '{print $1}')"
          fi
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::sha256 mismatch for ${bin} -- expected ${expected}, got ${actual}"
            exit 1
          fi
          install -m 0755 "${tmp}/${bin}" "${RUNNER_TEMP}/bin/mise"
          rm -rf "${tmp}"

      # Trust every config mise will read before the first check reads one (OD65, F58).
      # mise refuses an untrusted config outright; an untrusted file breaks every check.
      - name: mise trust
        run: mise trust --all

      # Install the pinned toolchain, then put mise's shims ahead of the ambient runner
      # version on PATH (F55, F56). MISE_PYTHON_COMPILE=0 — see the header.
      - name: mise install --locked
        env:
          # aqua:/ubi: metadata resolves through api.github.com; the job token buys the
          # authenticated per-repo quota instead of the shared-IP 60/hr anonymous one (F-T12-1).
          GITHUB_TOKEN: ${{ github.token }}
          MISE_PYTHON_COMPILE: "0"
        run: |
          set -euo pipefail
          mise install --locked
          mise bin-paths >> "$GITHUB_PATH"

      # OD17 third stage: resolve Python from the ubuntu-24.04 toolcache (F55b) so every
      # check below runs against 3.14.7, closing the three failure modes F53 measures against
      # the primary path alone. Same version mise.lock already pins — no pin moves.
      - name: Setup Python from toolcache (OD17 third stage)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      # SC6: prove the pin, not the ambient runner Python (F56 measures Python 3.12.3 ambient).
      - name: Resolved Python toolchain version
        run: python3 --version

      # SC7: ruff resolves through the aqua backend (per-platform digest recorded); mypy and
      # bandit resolve through the pipx backend (no digest, F67 measures 0 entries on that
      # backend) — the digest check is simply not run for those two. Installed from a
      # template-owned config so the caller's own committed mise.toml/mise.lock is never
      # touched.
      - name: Provision Python check binaries (ruff, mypy, bandit)
        env:
          # aqua:/ubi: metadata resolves through api.github.com; the job token buys the
          # authenticated per-repo quota instead of the shared-IP 60/hr anonymous one (F-T12-1).
          GITHUB_TOKEN: ${{ github.token }}
          MISE_CONFIG_FILE: ${{ runner.temp }}/python-source-check-tools.toml
        run: |
          set -euo pipefail
          cat > "${MISE_CONFIG_FILE}" <<'EOF'
          [tools]
          "aqua:astral-sh/ruff" = "0.14.3"
          "pipx:mypy" = "1.18.2"
          "pipx:bandit" = "1.9.1"
          EOF
          mise trust "${MISE_CONFIG_FILE}"
          mise install
          mise bin-paths >> "$GITHUB_PATH"

      - name: Installed check-tool versions (OD60)
        run: |
          set -euo pipefail
          ruff --version
          mypy --version
          bandit --version

      - name: Install language-tools ${{ env.LANGUAGE_TOOLS_VERSION }} (verified fetch)
        env:
          LT_OS: ${{ steps.platform.outputs.lt_os }}
          LT_ARCH: ${{ steps.platform.outputs.lt_arch }}
        run: |
          set -euo pipefail
          archive="language-tools_${LANGUAGE_TOOLS_VERSION}_${LT_OS}_${LT_ARCH}.tar.gz"
          base="https://github.com/johnrichter/language-tools/releases/download/v${LANGUAGE_TOOLS_VERSION}"
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/checksums.txt" "${base}/checksums.txt"
          curl -fsSL -o "${tmp}/${archive}" "${base}/${archive}"
          expected="$(awk -v want="${archive}" '$2 == want { print $1; exit }' "${tmp}/checksums.txt")"
          if [ -z "${expected}" ]; then
            echo "::error::${archive} not listed in checksums.txt for language-tools v${LANGUAGE_TOOLS_VERSION}"
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${tmp}/${archive}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "${tmp}/${archive}" | awk '{print $1}')"
          fi
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::sha256 mismatch for ${archive} -- expected ${expected}, got ${actual}"
            exit 1
          fi
          tar -xzf "${tmp}/${archive}" -C "${tmp}"
          install -m 0755 "${tmp}/language-tools" "${RUNNER_TEMP}/bin/language-tools"
          rm -rf "${tmp}"

      - name: Dry-run summary (installs verified, checks skipped)
        if: ${{ inputs.dry_run }}
        run: echo "dry-run summary -- mise ${{ inputs.mise_version }}, language-tools ${{ env.LANGUAGE_TOOLS_VERSION }} and ruff/mypy/bandit installed and verified, the source-checks steps are skipped"

      - name: language-tools format
        if: ${{ !inputs.dry_run }}
        run: language-tools format --language python --dir "${{ inputs.project_dir }}" --log-dir "${{ github.workspace }}/.language-tools/log"

      - name: language-tools lint
        if: ${{ !inputs.dry_run }}
        run: language-tools lint --language python --dir "${{ inputs.project_dir }}" --log-dir "${{ github.workspace }}/.language-tools/log"

      - name: language-tools vet
        if: ${{ !inputs.dry_run }}
        run: language-tools vet --language python --dir "${{ inputs.project_dir }}" --log-dir "${{ github.workspace }}/.language-tools/log"

      - name: language-tools security
        if: ${{ !inputs.dry_run }}
        run: language-tools security --language python --dir "${{ inputs.project_dir }}" --log-dir "${{ github.workspace }}/.language-tools/log"

      # Failure-path capture (contract section 10): export the per-check records a
      # failed check wrote under .language-tools/log so a gate_negative.toolchain.error
      # travels with the run instead of needing a local re-probe. Changes no check's
      # invocation, target root, subject set or verdict.
      - name: Capture language-tools logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: language-tools-logs-python-source-checks
          path: ${{ github.workspace }}/.language-tools/log/
          if-no-files-found: ignore

  build-test:
    name: build-test
    needs: source-checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-26, macos-26-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Resolve runner platform
        id: platform
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          case "$(uname -s)" in
            Linux)  mise_os=linux;  lt_os=linux  ;;
            Darwin) mise_os=macos;  lt_os=darwin ;;
            *) echo "::error::unsupported runner OS $(uname -s)"; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64)  mise_arch=x64;   lt_arch=amd64 ;;
            arm64|aarch64) mise_arch=arm64; lt_arch=arm64 ;;
            *) echo "::error::unsupported runner arch $(uname -m)"; exit 1 ;;
          esac
          {
            echo "mise_os=${mise_os}"
            echo "mise_arch=${mise_arch}"
            echo "lt_os=${lt_os}"
            echo "lt_arch=${lt_arch}"
          } >> "$GITHUB_OUTPUT"

      - name: Install mise ${{ inputs.mise_version }} (verified fetch)
        env:
          MISE_VERSION: ${{ inputs.mise_version }}
          MISE_OS: ${{ steps.platform.outputs.mise_os }}
          MISE_ARCH: ${{ steps.platform.outputs.mise_arch }}
        run: |
          set -euo pipefail
          bin="mise-v${MISE_VERSION}-${MISE_OS}-${MISE_ARCH}"
          base="https://github.com/jdx/mise/releases/download/v${MISE_VERSION}"
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/SHASUMS256.txt" "${base}/SHASUMS256.txt"
          curl -fsSL -o "${tmp}/${bin}" "${base}/${bin}"
          expected="$(awk -v want="./${bin}" '$2 == want { print $1; exit }' "${tmp}/SHASUMS256.txt")"
          if [ -z "${expected}" ]; then
            echo "::error::${bin} not listed in SHASUMS256.txt for mise v${MISE_VERSION}"
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${tmp}/${bin}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "${tmp}/${bin}" | awk '{print $1}')"
          fi
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::sha256 mismatch for ${bin} -- expected ${expected}, got ${actual}"
            exit 1
          fi
          install -m 0755 "${tmp}/${bin}" "${RUNNER_TEMP}/bin/mise"
          rm -rf "${tmp}"

      - name: mise trust
        run: mise trust --all

      - name: mise install --locked
        env:
          # aqua:/ubi: metadata resolves through api.github.com; the job token buys the
          # authenticated per-repo quota instead of the shared-IP 60/hr anonymous one (F-T12-1).
          GITHUB_TOKEN: ${{ github.token }}
          MISE_PYTHON_COMPILE: "0"
        run: |
          set -euo pipefail
          mise install --locked
          mise bin-paths >> "$GITHUB_PATH"

      # OD17 third stage: resolve Python from the toolcache (F55b names ubuntu-24.04; the
      # action resolves the same way on every image in this matrix) so build and both test
      # legs run against 3.14.7 on every platform, not just source-checks' single runner.
      - name: Setup Python from toolcache (OD17 third stage)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Resolved Python toolchain version
        run: python3 --version

      # SC7: playwright resolves through the pipx backend (no digest, F67 measures 0 entries
      # on that backend, and the npm backend records none either) — the digest check is
      # simply not run for it.
      - name: Provision Python check binaries (playwright)
        env:
          # aqua:/ubi: metadata resolves through api.github.com; the job token buys the
          # authenticated per-repo quota instead of the shared-IP 60/hr anonymous one (F-T12-1).
          GITHUB_TOKEN: ${{ github.token }}
          MISE_CONFIG_FILE: ${{ runner.temp }}/python-build-test-tools.toml
        run: |
          set -euo pipefail
          cat > "${MISE_CONFIG_FILE}" <<'EOF'
          [tools]
          "pipx:playwright" = "1.62.0"
          EOF
          mise trust "${MISE_CONFIG_FILE}"
          mise install
          mise bin-paths >> "$GITHUB_PATH"

      - name: Installed check-tool versions (OD60)
        run: playwright --version

      - name: Install language-tools ${{ env.LANGUAGE_TOOLS_VERSION }} (verified fetch)
        env:
          LT_OS: ${{ steps.platform.outputs.lt_os }}
          LT_ARCH: ${{ steps.platform.outputs.lt_arch }}
        run: |
          set -euo pipefail
          archive="language-tools_${LANGUAGE_TOOLS_VERSION}_${LT_OS}_${LT_ARCH}.tar.gz"
          base="https://github.com/johnrichter/language-tools/releases/download/v${LANGUAGE_TOOLS_VERSION}"
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/checksums.txt" "${base}/checksums.txt"
          curl -fsSL -o "${tmp}/${archive}" "${base}/${archive}"
          expected="$(awk -v want="${archive}" '$2 == want { print $1; exit }' "${tmp}/checksums.txt")"
          if [ -z "${expected}" ]; then
            echo "::error::${archive} not listed in checksums.txt for language-tools v${LANGUAGE_TOOLS_VERSION}"
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${tmp}/${archive}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "${tmp}/${archive}" | awk '{print $1}')"
          fi
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::sha256 mismatch for ${archive} -- expected ${expected}, got ${actual}"
            exit 1
          fi
          tar -xzf "${tmp}/${archive}" -C "${tmp}"
          install -m 0755 "${tmp}/language-tools" "${RUNNER_TEMP}/bin/language-tools"
          rm -rf "${tmp}"

      - name: Dry-run summary (installs verified, checks skipped)
        if: ${{ inputs.dry_run }}
        run: echo "dry-run summary -- mise ${{ inputs.mise_version }}, language-tools ${{ env.LANGUAGE_TOOLS_VERSION }} and playwright installed and verified, the build-test steps and extra_steps are skipped"

      - name: language-tools build
        if: ${{ !inputs.dry_run }}
        run: language-tools build --language python --dir "${{ inputs.project_dir }}" --log-dir "${{ github.workspace }}/.language-tools/log"

      - name: language-tools test unit
        if: ${{ !inputs.dry_run }}
        run: language-tools test unit --language python --dir "${{ inputs.project_dir }}" --log-dir "${{ github.workspace }}/.language-tools/log" --timeout "${{ inputs.test_timeout }}s"

      # OD61, F77: Playwright's Python distribution ships its own Chromium, unlike Go's
      # chromedp (which needs an ambient Chrome this fleet's Go template installs
      # separately) — no browser-install step belongs on this leg.
      - name: language-tools test e2e
        if: ${{ !inputs.dry_run }}
        run: language-tools test e2e --language python --dir "${{ inputs.project_dir }}" --log-dir "${{ github.workspace }}/.language-tools/log" --timeout "${{ inputs.test_timeout }}s"

      - name: Extra steps (repository-specific checks language-tools doesn't cover)
        if: ${{ !inputs.dry_run && inputs.extra_steps != '' }}
        run: ${{ inputs.extra_steps }}

      # Failure-path capture (contract section 10). Matrix-scoped artifact name.
      - name: Capture language-tools logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: language-tools-logs-python-build-test-${{ matrix.os }}
          path: ${{ github.workspace }}/.language-tools/log/
          if-no-files-found: ignore
