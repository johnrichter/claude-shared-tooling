# CI for claude-tooling (the authority layer of the security guardrail).
# Replaces the removed .gitlab-ci.yml — same shape: guardrail gates unit-tests,
# the Rust arch matrix, and the Go arch matrix, which run independently of
# each other.
#
# Rust workspace (rust/) — arch matrix: {linux, macos} x {x86_64, aarch64}. Each
# cell runs cargo fmt --check + cargo clippy -D warnings (zero-warnings lint
# bar) + cargo doc -D warnings (doc-gate: broken intra-doc links / doc lints
# fail red) + cargo test, native where a GitHub-hosted runner exists for that
# {os, arch} pair, build+lint only (test execution skipped, called out inline)
# where none does:
#   linux-x86_64   -> ubuntu-latest, native test.
#   linux-aarch64  -> ubuntu-24.04-arm (free arm64-Linux hosted runner for public
#                     repos), native test.
#   macos-aarch64  -> macos-latest is arm64-hosted, native test.
#   macos-x86_64   -> no hosted native runner; cross-compiled on macos-latest,
#                     fmt+clippy only (doc build is host-target and arch-independent
#                     for this pure crate, already covered by macos-aarch64).
#
# Go workspace (go/build-helpers) — same four-cell matrix, GOOS/GOARCH in place
# of the Rust target triple. Each cell runs gofmt -l (zero-diff lint bar) +
# go vet + go build for that GOOS/GOARCH, plus go test where a GitHub-hosted
# runner exists natively for that {os, arch} pair (same native/cross split as
# the Rust matrix above — macos-x86_64 is build+lint only).
#
# logkit-conformance — single job, parallel to the rust/go matrices: the cross-language
# byte-identity gate for the logkit record contract. Arch-independent (canonical JSON is
# byte-defined, not host-defined), so it runs once on linux-x86_64, but it needs the Go and
# Rust toolchains together because it drives both implementations in one run.
#
# clikit-conformance — same shape, same reasoning, for the clikit CLI output contract: one
# normalized result record and one of eleven exit codes, byte-identical and integer-identical
# across the Go and Rust implementations.
#
# golangci-lint — single job, parallel to the rust/go matrices, mirroring the
# Rust arch matrix's clippy gate: version-pinned (config + install both pin
# v2.12.2), zero-warning bar, no arch dependence so it runs once on linux-x86_64.

name: CI

on:
  push:
    branches: [main]
    # Module tags (go/git/v1.2.0, rust/<crate>/vX.Y.Z, bare vX.Y.Z) fire the workflow
    # so the version-guard check-tag gate below runs at tag-push time — '**' (not '*')
    # because module tag prefixes contain '/'.
    tags: ['**']
  pull_request:
    types: [opened, synchronize]

# Least privilege: every job here only reads the repo (checkout, scan, build, test).
# No job writes to the repo or calls the GitHub API, so contents:read is sufficient.
permissions:
  contents: read

jobs:
  # Secret-scanner guardrail — authority-layer tier: no --tier flag (this repo IS
  # the authority the tiered scans in the other repos defer to).
  guardrail:
    name: security-guardrail
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 so the SC-FREEZE guard can diff HEAD against the PR base
      # SHA (base..HEAD) — a shallow clone lacks that ancestor.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Secret scan (authority layer)
        run: python3 scripts/check_secrets.py --root .
      - name: No-raw-binary scan (tracked tree, authoritative)
        run: python3 scripts/check_no_raw_binary.py --tracked --root .
      # SC-CODEGOV: the dist-guard allowlist is a generated artifact — regenerate it from its
      # producer and fail on any byte difference, so a hand-edited allowlist.json or a producer
      # change landed without regenerating fails the same way. (The scan gate that rejects
      # committed binaries is staged until the pre-SC-DISTRIBUTION go/.bin/* debt is retired
      # through CD; see tooling/dist-guard/README.md.)
      - name: dist-guard allowlist is current with its producer (SC-CODEGOV)
        run: python3 tooling/dist-guard/check.py check --root .
      # SC-RESOLVE guardrail: a go.mod/go.sum that resolves to a binary/LFS
      # git attribute (instead of text) breaks external `go get` and diff/merge
      # for every consumer — this class only surfaced at the release barrier,
      # so every go.mod in the tree is checked here on every push/PR.
      - name: go.mod is a text git attribute (SC-RESOLVE)
        run: |
          fail=0
          while IFS= read -r -d '' modfile; do
            attr="$(git check-attr text -- "$modfile" | awk -F': ' '{print $3}')"
            if [ "$attr" != "set" ]; then
              echo "::error file=$modfile::resolves to text=$attr (want: set) - go get/diff/merge will treat it as binary"
              fail=1
            fi
          done < <(git ls-files -z -- '*go.mod')
          exit "$fail"
      # SC-FREEZE guardrail: deny writes to frozen plugin/corpus homes
      # (single source of record: tooling/freeze-guard/frozen-homes.json).
      # Diff the committed surface HEAD vs the PR base (or the push's before SHA);
      # the clean CI checkout has no uncommitted state to inspect otherwise.
      - name: SC-FREEZE (no writes to frozen plugin/corpus homes)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            python3 tooling/freeze-guard/check.py --base "$BASE_SHA"
          else
            python3 tooling/freeze-guard/check.py
          fi
      # Planted-violation test: prove the guard actually rejects frozen-home writes.
      # Creates a test file in a frozen home, runs the guard (expecting failure),
      # then reverts to clean state. This proves the guard's exit code and
      # violation reporting are correct.
      - name: SC-FREEZE planted-violation test (proves guard fails as designed)
        run: |
          # Plant a violation: touch a file in a frozen home.
          mkdir -p plugin-homes/datadog-docs-agent
          touch plugin-homes/datadog-docs-agent/planted-violation-test.txt
          # Run the guard in working-tree mode (no --base, so it sees uncommitted changes).
          set +e
          python3 tooling/freeze-guard/check.py
          exit_code=$?
          set -e
          # Clean up the planted violation before checking the exit code.
          rm -rf plugin-homes
          # Verify the guard failed (exit 1) as designed.
          if [ "$exit_code" -eq 1 ]; then
            echo "✓ Guard correctly rejected frozen-home write (exit 1)"
          else
            echo "✗ Guard did not fail on frozen-home violation (exit $exit_code, expected 1)"
            exit 1
          fi

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    needs: guardrail
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      # The invariant-registry tests validate against the published schema with the pinned
      # validator; every other test here is stdlib-only.
      - name: Install the pinned schema validator
        run: pip install -r schemas/invariant-registry/requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  # SC-ENFORCE guardrail: schemas/invariant-registry is the single source of record for every
  # enforcement invariant this repo and the plugins it governs ship — rung, fail direction, blast
  # radius, and the per-rung field a consumer verifies. This job runs the registry's own lint: the
  # document validates against its schema, no invariant is declared twice by restatement, every
  # declared gate path resolves, a gate publishing its own declaration agrees with the registry,
  # and every discovered in-scope gate carries an entry. Rung-1 symbol resolution and rung-3
  # test-id resolution belong to tooling/invariant-lint, not here. Only this repository is checked
  # out, so the sibling-repo discovery roots report NOT CHECKED rather than passing —
  # --require-roots is deliberately not set (a repo nobody cloned is a checkout condition, not a
  # signal). See schemas/invariant-registry/README.md.
  invariant-registry:
    name: invariant-registry
    runs-on: ubuntu-latest
    needs: guardrail
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned validator in an isolated venv, never the system interpreter (SC-DEPPOLICY).
      - name: Install the pinned schema validator
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r schemas/invariant-registry/requirements.txt
      - name: Registry is valid, non-duplicating and complete (SC-ENFORCE)
        run: .venv/bin/python schemas/invariant-registry/check.py

  # SC-ENFORCE guardrail: the two machine-checked rungs of the invariant registry are
  # verified, not merely declared. This job resolves every shipped rung-1 fail_fast_symbol
  # in its named source file and runs every shipped rung-3 test_id, failing on a rename, a
  # move, a deletion, a nonexistent test, or a test that resolves but is skipped. See
  # tooling/invariant-lint/README.md.
  invariant-lint:
    name: invariant-lint
    runs-on: ubuntu-latest
    needs: guardrail
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      # A rung-3 test_id is re-executed in a subprocess by invariant-lint itself, so any
      # dependency that test needs (the pinned schema validator, for the invariant-registry
      # suite) must already be on this interpreter, same as the unit-tests job.
      - name: Install the pinned schema validator
        run: pip install -r schemas/invariant-registry/requirements.txt
      - name: Rung-1 symbols resolve, rung-3 tests exist and run (SC-ENFORCE)
        run: python3 tooling/invariant-lint/check.py

  # SC-MODELROSTER / SC-CODEGOV: schemas/model-roster/model-roster.json is the single source of
  # record for the selectable Claude model set. This job regenerates every roster-derived
  # artifact this repo commits and fails on any byte difference, so a hand-edited artifact or a
  # roster change landed without regenerating fails the same way go.anthropic-specifications.json
  # would silently drift otherwise. See tooling/roster-currency/README.md.
  roster-currency:
    name: roster-currency
    runs-on: ubuntu-latest
    needs: guardrail
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate-and-diff every roster-derived artifact
        run: python3 tooling/roster-currency/check.py

  # SC-VERSIONING guardrail: tooling/version-guard enforces the two rules in the top-level
  # README's "Versioning" section — a module tag's path prefix must name a real module in
  # the tree, and no Rust crate may depend on a workspace neighbor via `path = ...` (a path
  # dependency can't survive the two crates being tagged/consumed independently). See
  # tooling/version-guard/README.md.
  version-guard:
    name: version-guard
    runs-on: ubuntu-latest
    needs: guardrail
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag conforms to SC-VERSIONING
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 tooling/version-guard/check.py check-tag "${GITHUB_REF_NAME}"
      # Required gate, scoped to the one documented exception: rust/frontmatter's dependency
      # on facetquery is a known, workspace-internal path dependency (see version-guard
      # README, "Today's known violation") pending a fix outside this gate's scope. Any
      # OTHER path-dependency violation (that Cargo.toml line, or a new one anywhere else)
      # still fails the job — this does not blanket-waive the check.
      - name: No Rust path/relative dependencies
        run: |
          set +e
          output="$(python3 tooling/version-guard/check.py check-deps 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          unexpected="$(echo "$output" | grep '^version-guard:' | grep -v "rust/frontmatter/Cargo.toml:54: 'facetquery' is a path dependency" | grep -v '^version-guard: 1 Rust path/relative dependency(ies) found' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected version-guard violation(s) beyond the documented facetquery exception"
            exit 1
          fi
          echo "::warning::known exception: rust/frontmatter -> facetquery path dependency (see tooling/version-guard/README.md)"

  # SC-CONTRACT guardrail: schemas/logkit is one record contract with several implementations,
  # and "the same event produces the same bytes" is the only property that makes it an interop
  # contract rather than three similar loggers. This job runs the shared golden input set
  # through every implementation and fails on any byte difference — language against language,
  # and each language against the recorded goldens. It also runs the gate's own selftest, which
  # plants a single-language drift and requires the gate to catch it, so a gate that has stopped
  # discriminating fails here instead of passing quietly. Any finding is a pause for a human:
  # there is no declared-delta list and no per-case waiver. See conformance/logkit/README.md.
  logkit-conformance:
    name: logkit-conformance
    runs-on: ubuntu-latest
    needs: guardrail
    steps:
      # go.mod is LFS-routed (see the go job below) — lfs: true smudges go/logkit's manifest so
      # setup-go reads the real go directive instead of a pointer stub.
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/logkit/go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every implementation emits the same normalized record (SC-CONTRACT)
        run: python3 conformance/logkit/check.py
      # Planted-drift test: prove the gate discriminates. Each plant is a one-token edit to one
      # language's level token, applied to the working tree and reverted from the bytes read
      # before it was applied; the third plant removes a golden, which must fail rather than be
      # regenerated. The gate must return 1 for each.
      - name: Planted single-language drift fails the gate (SC-CONTRACT)
        run: python3 conformance/logkit/check.py --selftest

  # SC-CONTRACT guardrail: schemas/clikit is one output/error/exit contract with several
  # implementations, and "the same outcome produces the same record bytes and the same exit code"
  # is the only property that makes it an interop contract rather than two similar CLI libraries.
  # This job runs the shared golden input set through every implementation and fails on any
  # difference — language against language, each language against the recorded goldens, and every
  # golden against the contract's own source files in schemas/clikit (the one check a
  # cross-language agreement cannot substitute for: a wrong status/exit-code pairing both
  # languages share is invisible to comparison). It also runs the gate's own selftest, which
  # plants a single-language drift, removes a golden and mispairs a record, requiring the gate to
  # catch each. Any finding is a pause for a human: there is no declared-delta list and no
  # per-case waiver. See conformance/clikit/README.md.
  clikit-conformance:
    name: clikit-conformance
    runs-on: ubuntu-latest
    needs: guardrail
    steps:
      # No lfs: true — every file this gate reads (the suite, both implementations, the contract,
      # and go/clikit's manifests, which the SC-RESOLVE step above requires to be text) is a
      # plain tracked file, so a default checkout is already complete for it.
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/clikit/go.mod
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every implementation emits the same record and the same exit code (SC-CONTRACT)
        run: python3 conformance/clikit/check.py
      # Planted-drift test: prove the gate discriminates. Each source plant is a one-token edit to
      # one language (Go's exit-code pairing, Rust's record version), applied to the working tree
      # and reverted from the bytes read before it was applied; two more plants remove a golden,
      # which must fail rather than be regenerated, and the last mispairs a record in memory to
      # exercise the contract check. The gate must return 1 for each.
      - name: Planted single-language drift fails the gate (SC-CONTRACT)
        run: python3 conformance/clikit/check.py --selftest

  rust:
    name: rust-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: guardrail
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            test_native: true
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            test_native: true
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            test_native: true
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            test_native: false
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - name: cargo fmt --check
        run: cargo fmt --manifest-path rust/Cargo.toml --check
      - name: cargo clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --target "${{ matrix.target }}" --all-targets --all-features -- -D warnings
      # Doc-gate: warnings-as-errors doc build (host-target; rustdoc output is arch-independent for
      # this pure crate). Catches broken/private intra-doc links and doc lints that neither fmt nor
      # clippy sees. Skipped on the macos-x86_64 cross cell — already covered on macos-aarch64.
      - name: cargo doc (warnings as errors)
        if: matrix.name != 'macos-x86_64'
        run: cargo doc --manifest-path rust/Cargo.toml --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: cargo test (native only)
        if: matrix.test_native
        run: cargo test --manifest-path rust/Cargo.toml --target "${{ matrix.target }}"
      - name: Skip test execution (cross target, no native runner)
        if: ${{ !matrix.test_native }}
        run: echo "cross target ${{ matrix.target }} - fmt+clippy only (no hosted runner to execute the test binary natively)"

  go:
    name: go-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: guardrail
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            test_native: true
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            test_native: true
          - name: macos-aarch64
            os: macos-latest
            goos: darwin
            goarch: arm64
            test_native: true
          - name: macos-x86_64
            os: macos-latest
            goos: darwin
            goarch: amd64
            test_native: false
    steps:
      # go.mod is LFS-routed (the *.mod binary-extension rule also catches Go's
      # go.mod), and go/.bin/* prebuilt binaries are LFS-routed too — lfs: true
      # smudges both so the checkout is buildable, not pointer stubs.
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/build-helpers/go.mod
      - name: gofmt --check
        working-directory: go/build-helpers
        run: |
          fmt_diff="$(gofmt -l .)"
          if [ -n "$fmt_diff" ]; then
            echo "$fmt_diff"
            exit 1
          fi
      - name: go vet
        working-directory: go/build-helpers
        run: go vet ./...
      - name: go build (${{ matrix.goos }}/${{ matrix.goarch }})
        working-directory: go/build-helpers
        run: go build -trimpath -ldflags='-s -w' -o /dev/null .
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - name: go test (native only)
        if: matrix.test_native
        working-directory: go/build-helpers
        run: go test ./...
      - name: Skip test execution (cross target, no native runner)
        if: ${{ !matrix.test_native }}
        run: echo "cross target ${{ matrix.goos }}/${{ matrix.goarch }} - build+vet+fmt only (no hosted runner to execute the test binary natively)"

  # SC-FORCEDUSE / SC-DISTRIBUTION guardrail: plugin-foundation's two POSIX-sh scripts
  # (forced-use-hook.sh, download-script.sh) are shared byte-identical into every govern-now
  # CLI's plugin, so a regression here reaches every consumer at once. jq is required by
  # forced-use-hook.sh and preinstalled on ubuntu-latest; no other tooling is needed.
  plugin-foundation-shell:
    name: plugin-foundation-shell
    runs-on: ubuntu-latest
    needs: guardrail
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - name: forced-use-hook.sh regression suite
        working-directory: plugin-foundation
        run: bash forced-use-hook.test.sh
      - name: download-script.sh regression suite
        working-directory: plugin-foundation
        run: bash download-script.test.sh

  golangci-lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    needs: guardrail
    steps:
      # go.mod is LFS-routed (see the go job above) — lfs: true smudges it so
      # setup-go's go-version-file read sees the real go directive, not a pointer stub.
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/build-helpers/go.mod
      - uses: golangci/golangci-lint-action@v8.0.0
        with:
          version: v2.12.2
          working-directory: go/build-helpers

  # GH-specific caveat, no GitLab equivalent needed here: GitHub Advanced Security secret
  # scanning is a repo/org SETTING, not a workflow step — it cannot be replicated as a job
  # in this file. Confirm secret scanning is enabled at the claude-tooling repo level;
  # it runs independently of this CI and replaces GitLab's Security/Secret-Detection template.
