# Reusable SC-DISTRIBUTION release template — LIBRARY track. Fleet-wide: any repository's
# workflow may call this, not only ai-shared-lib's own modules (the original scope this file
# shipped with). Calling it now requires a mise.toml + mise.lock at the caller's checked-out
# repo root pinning a toolchain, and network access to fetch a pinned language-tools release —
# a pre-mise caller of this file needed neither.
#
# A library releases by pinning a git tag; there is nothing to archive. Consumers pull the
# tagged source directly (a Rust git-tag dependency, a Go module tag, a documented commit).
# A module-owning workflow calls this via `workflow_call`; it tags and cuts the official
# platform release, nothing else — dist-guard (tooling/dist-guard/) is what keeps a built
# artifact from ever needing to be committed in the first place.
#
# Shares ci-go.yml's canonical preamble (mise pin, verified fetch, platform resolution) up
# through installing language-tools, byte-for-byte; a change to that shared shape belongs in
# ci-go.yml first, then copies here. It departs from the CI templates' preamble the same way
# release-cli.yml does, for the same release-track reason: there are no checks to run, so
# there is no dry_run-gated "checks skipped" step, no extra_steps escape hatch, and no
# cross-repository sibling-checkout input. Unlike release-cli.yml, this template runs no
# build either — a tag has nothing to compile — so mise and language-tools install here as a
# standing dependency the fleet now requires of every template, not because a step below
# invokes language-tools directly. Nothing here runs a checked language command, so nothing
# on the banned-check-command list can run as a check.
#
# GitLab equivalent: the same tag-push + `release-cli create` pair as an `include:`d job in a
# caller `.gitlab-ci.yml`. No separate GitLab template exists in this repo; this file is the
# GitHub Actions implementation of the SC-DISTRIBUTION library contract.

name: SC-DISTRIBUTION release (library)

on:
  workflow_call:
    inputs:
      version:
        description: "Tag to cut, e.g. schemas/model-roster/v1.2.3 (SC-VERSIONING: tag prefix == module path)."
        required: true
        type: string
      release_notes:
        description: "Release body; omitted lets the platform auto-generate notes from commits."
        required: false
        type: string
        default: ""
      runs_on:
        description: "Fully qualified GitHub-hosted runner label (actions/runner-images). Never a floating tag."
        required: false
        type: string
        default: "ubuntu-24.04"
      mise_version:
        description: "mise release the template installs. Latest stable patch, measured at write time per K11/S7. Every committed mise.lock must be re-locked with this version."
        required: false
        type: string
        default: "2026.9.1"
      dry_run:
        description: "Verify only — skip the tag push and the platform release."
        required: false
        type: boolean
        default: false
    secrets:
      GH_TOKEN:
        description: "Token with contents:write, for `gh release create`. Unused in dry-run."
        required: false

env:
  # Named once; every step below reads this instead of restating the version.
  # OD69 sets 3.0.0 (major bump: SC5 makes --language a required selector on `release build`).
  LANGUAGE_TOOLS_VERSION: "3.0.0"

permissions:
  contents: write

jobs:
  release:
    name: tag-and-release
    runs-on: ${{ inputs.runs_on }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # mise and language-tools name platforms differently (mise: linux/macos, x64/arm64;
      # language-tools: Go's own linux/darwin, amd64/arm64) — resolve both once, here.
      - name: Resolve runner platform
        id: platform
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          case "$(uname -s)" in
            Linux)  mise_os=linux;  lt_os=linux  ;;
            Darwin) mise_os=macos;  lt_os=darwin ;;
            *) echo "::error::unsupported runner OS $(uname -s)"; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64)  mise_arch=x64;   lt_arch=amd64 ;;
            arm64|aarch64) mise_arch=arm64; lt_arch=arm64 ;;
            *) echo "::error::unsupported runner arch $(uname -m)"; exit 1 ;;
          esac
          {
            echo "mise_os=${mise_os}"
            echo "mise_arch=${mise_arch}"
            echo "lt_os=${lt_os}"
            echo "lt_arch=${lt_arch}"
          } >> "$GITHUB_OUTPUT"

      # Verified fetch (SC1 shape): fetch the release's own published checksum manifest,
      # look up this artifact's digest by exact filename match, then fetch the artifact and
      # fail closed on any mismatch. Never pipes a download into a shell.
      - name: Install mise ${{ inputs.mise_version }} (verified fetch)
        env:
          MISE_VERSION: ${{ inputs.mise_version }}
          MISE_OS: ${{ steps.platform.outputs.mise_os }}
          MISE_ARCH: ${{ steps.platform.outputs.mise_arch }}
        run: |
          set -euo pipefail
          bin="mise-v${MISE_VERSION}-${MISE_OS}-${MISE_ARCH}"
          base="https://github.com/jdx/mise/releases/download/v${MISE_VERSION}"
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/SHASUMS256.txt" "${base}/SHASUMS256.txt"
          curl -fsSL -o "${tmp}/${bin}" "${base}/${bin}"
          expected="$(awk -v want="./${bin}" '$2 == want { print $1; exit }' "${tmp}/SHASUMS256.txt")"
          if [ -z "${expected}" ]; then
            echo "::error::${bin} not listed in SHASUMS256.txt for mise v${MISE_VERSION}"
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${tmp}/${bin}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "${tmp}/${bin}" | awk '{print $1}')"
          fi
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::sha256 mismatch for ${bin} -- expected ${expected}, got ${actual}"
            exit 1
          fi
          install -m 0755 "${tmp}/${bin}" "${RUNNER_TEMP}/bin/mise"
          rm -rf "${tmp}"

      # Trust every config mise will read before the first install reads one (OD65, F58).
      # mise refuses an untrusted config outright; an untrusted file breaks the install.
      - name: mise trust
        run: mise trust --all

      # Install the pinned toolchain, then put mise's shims ahead of the ambient runner
      # version on PATH (F55, F56) — this template's own steps below must resolve the pin,
      # not whatever the image ships.
      - name: mise install --locked
        run: |
          set -euo pipefail
          mise install --locked
          mise bin-paths >> "$GITHUB_PATH"

      - name: Install language-tools ${{ env.LANGUAGE_TOOLS_VERSION }} (verified fetch)
        env:
          LT_OS: ${{ steps.platform.outputs.lt_os }}
          LT_ARCH: ${{ steps.platform.outputs.lt_arch }}
        run: |
          set -euo pipefail
          archive="language-tools_${LANGUAGE_TOOLS_VERSION}_${LT_OS}_${LT_ARCH}.tar.gz"
          base="https://github.com/johnrichter/language-tools/releases/download/v${LANGUAGE_TOOLS_VERSION}"
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/checksums.txt" "${base}/checksums.txt"
          curl -fsSL -o "${tmp}/${archive}" "${base}/${archive}"
          expected="$(awk -v want="${archive}" '$2 == want { print $1; exit }' "${tmp}/checksums.txt")"
          if [ -z "${expected}" ]; then
            echo "::error::${archive} not listed in checksums.txt for language-tools v${LANGUAGE_TOOLS_VERSION}"
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${tmp}/${archive}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "${tmp}/${archive}" | awk '{print $1}')"
          fi
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::sha256 mismatch for ${archive} -- expected ${expected}, got ${actual}"
            exit 1
          fi
          tar -xzf "${tmp}/${archive}" -C "${tmp}"
          install -m 0755 "${tmp}/language-tools" "${RUNNER_TEMP}/bin/language-tools"
          rm -rf "${tmp}"

      # A release tag is an annotated tag, which needs a tagger identity; the checkout above
      # carries none. No caller identity is required or assumed — the fleet's own bot identity
      # signs every release tag this template cuts.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Accepts a tag already at HEAD (a tag-push trigger runs against a commit whose tag
      # already exists by definition, and a re-run of the dispatch path at the same commit
      # finds the tag it pushed last time — both idempotent); rejects a tag that exists
      # anywhere else, since a release tag is never moved.
      - name: Check for an existing tag
        id: tagcheck
        env:
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag_commit="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "${tag_commit}" != "${head_commit}" ]; then
            echo "::error::tag ${TAG} already exists at ${tag_commit}, not HEAD (${head_commit}) - a release tag is never moved"
            exit 1
          fi
          echo "tag ${TAG} already exists at HEAD (${head_commit}) - reusing it rather than re-tagging"
          echo "exists=true" >> "$GITHUB_OUTPUT"

      - name: Tag HEAD
        if: ${{ !inputs.dry_run && steps.tagcheck.outputs.exists == 'false' }}
        env:
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"

      - name: Publish the official release (tag only, no archive)
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          TAG: ${{ inputs.version }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_NOTES" ]; then
            gh release create "$TAG" --title "$TAG" --notes "$RELEASE_NOTES"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        env:
          TAG: ${{ inputs.version }}
        run: |
          echo "dry-run: would tag and release ${TAG} - no archive attached (library track)"
