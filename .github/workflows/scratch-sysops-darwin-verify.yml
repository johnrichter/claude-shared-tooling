name: scratch-sysops-darwin-verify

on:
  workflow_dispatch: {}
  # workflow_dispatch only fires via the API for a workflow already registered
  # on the default branch; this scratch file lives on this branch alone, so a
  # push trigger scoped to it is what actually runs it for real verification.
  push:
    branches:
      - chore/sysops-darwin-guard

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/sysops/go.mod
      - run: cd go/sysops && go test ./...
