# Reusable CI template — shell track. Implements the fleet CI template contract
# (docs/ci-template-contract.md) for a language that neither compiles nor packages: one
# job, no `build`, no matrix to gate (SC8's population excludes this template by
# construction). `vet` is skipped too — the standard records type checking as not
# applicable for shell — so the job runs the remaining five MATRIX pairs: `format`, `lint`,
# `security`, `test unit` and `test e2e` (OD3, OD50, OD51). The checkout and verified-fetch
# steps for mise and language-tools are byte-for-byte shared with ci-go.yml, ci-rust.yml and
# ci-python.yml; a change to that shared shape belongs in ci-go.yml first, then copies here.
#
# Toolchain activation. Go, Rust and Python each pin a per-repo language version through the
# caller's own committed mise.toml/mise.lock, so those templates run `mise install --locked`
# against it. Shell has no such per-repo version to pin — the five check binaries below are
# themselves the only "toolchain" this track activates, and they install from a
# template-owned config, never the caller's. `mise trust --all` still runs first: a caller
# repo can carry its own unrelated mise.toml (for a different language's local dev setup),
# and mise refuses to read any config it has not trusted, which would break the provisioning
# step that follows even though that step never touches the caller's file.
#
# Check-tool provisioning (contract section 5): shellcheck, shfmt, bats-core, semgrep and jq
# — five of the shell share of F54's 23-binary matrix — install from a template-owned mise
# config written to RUNNER_TEMP and pointed at via MISE_CONFIG_FILE. Each is pinned at its
# latest stable version (OD49). shellcheck, shfmt, bats-core and jq resolve through the aqua
# backend, which records a per-platform digest; semgrep resolves through the pipx backend,
# which records none (F67 measures 0 entries on that backend) — the digest check is simply
# not run for it.
#
# checkbashisms and kcov reach the runner through neither mise backend the contract's matrix
# names for them, for two different reasons. checkbashisms reaches no mise backend at all
# (F79) — it installs from the `devscripts` apt package, refreshing the apt cache first
# (OD59). kcov names a `ubi:` backend, but SimonKagstrom/kcov's GitHub releases ship no
# downloadable asset for any platform as of the latest release (v43) — `mise install` against
# that backend fails closed with no release to select. apt carries no fallback either: kcov
# is absent from Ubuntu noble's archive on every architecture, not only arm64, so the same
# `apt-get install` that provisions checkbashisms cannot also provision kcov. This template
# builds kcov from source instead, pinned to the v43 tag's own commit (never the branch tip),
# from apt-installed build dependencies present in noble's archive on every architecture.
# Both channels put every shell source check on one platform (`ubuntu-24.04-arm`, OD63) — the
# Homebrew channel serving the other templates' macOS `build`/`test` legs has no counterpart
# here, because this template has no macOS leg.
#
# Include list (OD12). `language-tools` has no flag for a file a script sources from outside
# the directory it is checking, and shellcheck's own `external-sources=true` (baked into
# language-tools' `.shellcheckrc`) only stops it from failing on a source target it cannot
# see — it does not make that target visible. `inputs.include` names the files and
# directories a script sources; the workflow resolves each entry to a directory (a file
# entry resolves to its containing directory) and writes the deduplicated, colon-joined
# result to `SHELLCHECK_OPTS` as a `-P` search path. shellcheck reads that environment
# variable itself, and the shell adapter's subprocess inherits the job's environment, so the
# search path reaches shellcheck without language-tools needing to know about it.
#
# Recursion (OD54). `--dir` on the shell track walks every shell file at or below the named
# root, `.githooks/` included, so one call per repository — this template's whole job — is
# enough; no adopter needs a per-directory call.
#
# Inputs:
#   runs_on                          (string,  default "ubuntu-24.04-arm")
#     Fully qualified GitHub-hosted runner label, published by actions/runner-images.
#     Never a floating tag (ubuntu-latest, ...): those move under a caller without notice.
#     Unused by this template's own job placement — OD63 fixes the checks job's platform in
#     the template rather than leaving it to a caller — kept for input-naming parity with
#     the other five templates (section 1).
#   script_root                      (string,  default ".")
#     Root language-tools recurses from (`--dir`), relative to the checked-out repo. Covers
#     every shell file at or below it, `.githooks/` included (OD54).
#   include                          (string,  default "")
#     Newline-separated list of files and directories a script under script_root sources or
#     imports from outside its own directory (OD12). Each entry resolves to a directory and
#     feeds shellcheck's `-P` search path via SHELLCHECK_OPTS. Empty adds no search path.
#   dry_run                          (boolean, default false)
#     true installs and verifies mise, language-tools and the seven check binaries, then
#     stops — every check step and extra_steps are skipped. Proves the call contract and the
#     installs without needing the caller's scripts to actually pass a check.
#   test_timeout                     (number,  default 300)
#     Wall-clock bound per test subcommand, in seconds. Applied to each `test` subcommand
#     step as `--timeout <n>s`. Default is language-tools' own binary default (300 s).
#   extra_steps                      (string,  default "")
#     Shell script run after the checks, for a repository-specific check language-tools
#     doesn't cover. Empty runs nothing.
#
# Caller contract: the caller supplies nothing but these inputs — this template checks out
# the caller's own repo itself, at repo root, once per job. It needs no secret and pushes and
# publishes nothing.

name: CI template (Shell)

on:
  workflow_call:
    inputs:
      runs_on:
        description: "Fully qualified GitHub-hosted runner label (actions/runner-images). Never a floating tag. Unused for this template's own job placement (OD63 fixes it in the template); kept for input-naming parity with the other five templates."
        required: false
        type: string
        default: "ubuntu-24.04-arm"
      script_root:
        description: "Root language-tools recurses from (--dir), relative to the checked-out repo. Covers every shell file at or below it, .githooks/ included (OD54)."
        required: false
        type: string
        default: "."
      include:
        description: "Newline-separated list of files and directories a script under script_root sources or imports from outside its own directory (OD12). Each entry resolves to a directory and feeds shellcheck's -P search path via SHELLCHECK_OPTS. Empty adds no search path."
        required: false
        type: string
        default: ""
      dry_run:
        description: "true installs and verifies mise, language-tools and the seven check binaries, then stops; every check step and extra_steps are skipped."
        required: false
        type: boolean
        default: false
      test_timeout:
        description: "Wall-clock bound per test subcommand, in seconds. Applied as language-tools --timeout <n>s. Default is the binary default (300 s)."
        required: false
        type: number
        default: 300
      extra_steps:
        description: "Shell script run after the checks, for a repository-specific check language-tools doesn't cover. Empty runs nothing."
        required: false
        type: string
        default: ""

env:
  # Named once; every step below reads this instead of restating the version.
  # 3.0.1 patch-bumps 3.0.0 (OD69's major bump, SC5: --language became a required selector on `release build`); 3.0.1 carries the embedded .shellcheckrc fix.
  LANGUAGE_TOOLS_VERSION: "3.0.1"

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04-arm        # OD63: one platform, a script neither compiles nor packages
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # mise and language-tools name platforms differently (mise: linux/macos, x64/arm64;
      # language-tools: Go's own linux/darwin, amd64/arm64) — resolve both once, here.
      - name: Resolve runner platform
        id: platform
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          case "$(uname -s)" in
            Linux)  mise_os=linux;  lt_os=linux  ;;
            Darwin) mise_os=macos;  lt_os=darwin ;;
            *) echo "::error::unsupported runner OS $(uname -s)"; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64)  mise_arch=x64;   lt_arch=amd64 ;;
            arm64|aarch64) mise_arch=arm64; lt_arch=arm64 ;;
            *) echo "::error::unsupported runner arch $(uname -m)"; exit 1 ;;
          esac
          {
            echo "mise_os=${mise_os}"
            echo "mise_arch=${mise_arch}"
            echo "lt_os=${lt_os}"
            echo "lt_arch=${lt_arch}"
          } >> "$GITHUB_OUTPUT"

      # Verified fetch (SC1 shape): fetch the release's own published checksum manifest,
      # look up this artifact's digest by exact filename match, then fetch the artifact and
      # fail closed on any mismatch. Never pipes a download into a shell.
      - name: Install mise (verified fetch)
        env:
          MISE_VERSION: "2026.9.1"
          MISE_OS: ${{ steps.platform.outputs.mise_os }}
          MISE_ARCH: ${{ steps.platform.outputs.mise_arch }}
        run: |
          set -euo pipefail
          bin="mise-v${MISE_VERSION}-${MISE_OS}-${MISE_ARCH}"
          base="https://github.com/jdx/mise/releases/download/v${MISE_VERSION}"
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/SHASUMS256.txt" "${base}/SHASUMS256.txt"
          curl -fsSL -o "${tmp}/${bin}" "${base}/${bin}"
          expected="$(awk -v want="./${bin}" '$2 == want { print $1; exit }' "${tmp}/SHASUMS256.txt")"
          if [ -z "${expected}" ]; then
            echo "::error::${bin} not listed in SHASUMS256.txt for mise v${MISE_VERSION}"
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${tmp}/${bin}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "${tmp}/${bin}" | awk '{print $1}')"
          fi
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::sha256 mismatch for ${bin} -- expected ${expected}, got ${actual}"
            exit 1
          fi
          install -m 0755 "${tmp}/${bin}" "${RUNNER_TEMP}/bin/mise"
          rm -rf "${tmp}"

      # Trust every config mise will read before the first check reads one (OD65, F58). A
      # caller repo's own, unrelated mise.toml would otherwise block the provisioning step
      # below even though that step never installs anything from it.
      - name: mise trust
        run: mise trust --all

      # SC7: shellcheck, shfmt, bats-core and jq resolve through the aqua backend, which
      # records a per-platform digest; semgrep resolves through the pipx backend, which
      # records none (F67 measures 0 entries on that backend) — the digest check is simply
      # not run for it. Installed from a template-owned config so the caller's own committed
      # mise.toml/mise.lock is never touched.
      - name: Provision shell check binaries (shellcheck, shfmt, bats-core, semgrep, jq)
        env:
          MISE_CONFIG_FILE: ${{ runner.temp }}/shell-check-tools.toml
        run: |
          set -euo pipefail
          cat > "${MISE_CONFIG_FILE}" <<'EOF'
          [tools]
          "aqua:koalaman/shellcheck" = "0.11.0"
          "aqua:mvdan/sh" = "3.14.0"
          "aqua:bats-core/bats-core" = "1.14.0"
          "pipx:semgrep" = "1.176.1"
          "aqua:jqlang/jq" = "1.8.2"
          EOF
          mise trust "${MISE_CONFIG_FILE}"
          mise install
          mise bin-paths >> "$GITHUB_PATH"

      # checkbashisms reaches no mise backend (F79) — installs from the devscripts package.
      # kcov names a ubi: backend in the contract's matrix, but that backend's upstream
      # release ships no downloadable asset for any platform, and apt carries no kcov package
      # on noble either — so this builds kcov from source, pinned to the v43 tag's own commit,
      # from apt-installed build dependencies. Cache refreshes first (OD59).
      - name: Provision shell check binaries (checkbashisms, kcov)
        env:
          KCOV_COMMIT: a39874f938ce13f7a65f253120d1ec946b349ffe # v43
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y devscripts build-essential cmake pkg-config \
            binutils-dev libelf-dev libdw-dev libiberty-dev libssl-dev \
            libcurl4-openssl-dev zlib1g-dev
          tmp="$(mktemp -d)"
          git clone --quiet https://github.com/SimonKagstrom/kcov.git "${tmp}/kcov"
          git -C "${tmp}/kcov" checkout --quiet "${KCOV_COMMIT}"
          cmake -S "${tmp}/kcov" -B "${tmp}/kcov/build"
          cmake --build "${tmp}/kcov/build" --parallel "$(nproc)"
          sudo cmake --install "${tmp}/kcov/build"
          rm -rf "${tmp}"

      - name: Installed check-tool versions (OD60)
        run: |
          set -euo pipefail
          shellcheck --version
          shfmt --version
          bats --version
          semgrep --version
          jq --version
          checkbashisms --version
          kcov --version

      - name: Install language-tools ${{ env.LANGUAGE_TOOLS_VERSION }} (verified fetch)
        env:
          LT_OS: ${{ steps.platform.outputs.lt_os }}
          LT_ARCH: ${{ steps.platform.outputs.lt_arch }}
        run: |
          set -euo pipefail
          archive="language-tools_${LANGUAGE_TOOLS_VERSION}_${LT_OS}_${LT_ARCH}.tar.gz"
          base="https://github.com/johnrichter/language-tools/releases/download/v${LANGUAGE_TOOLS_VERSION}"
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/checksums.txt" "${base}/checksums.txt"
          curl -fsSL -o "${tmp}/${archive}" "${base}/${archive}"
          expected="$(awk -v want="${archive}" '$2 == want { print $1; exit }' "${tmp}/checksums.txt")"
          if [ -z "${expected}" ]; then
            echo "::error::${archive} not listed in checksums.txt for language-tools v${LANGUAGE_TOOLS_VERSION}"
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${tmp}/${archive}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "${tmp}/${archive}" | awk '{print $1}')"
          fi
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::sha256 mismatch for ${archive} -- expected ${expected}, got ${actual}"
            exit 1
          fi
          tar -xzf "${tmp}/${archive}" -C "${tmp}"
          install -m 0755 "${tmp}/language-tools" "${RUNNER_TEMP}/bin/language-tools"
          rm -rf "${tmp}"

      # OD12: resolve inputs.include to the search path shellcheck's own external-sources
      # resolution needs. Each entry becomes a directory (a file entry resolves to its
      # containing directory); the deduplicated, colon-joined result becomes a -P argument
      # via SHELLCHECK_OPTS, which shellcheck reads from its own process environment.
      - name: Resolve shellcheck include search path (OD12)
        if: ${{ inputs.include != '' }}
        env:
          INCLUDE: ${{ inputs.include }}
        run: |
          set -euo pipefail
          paths=""
          while IFS= read -r entry; do
            entry="${entry%$'\r'}"
            [ -z "${entry}" ] && continue
            case "${entry}" in
              /*) abs="${entry}" ;;
              *)  abs="${GITHUB_WORKSPACE}/${entry}" ;;
            esac
            if [ -d "${abs}" ]; then
              dir="${abs}"
            else
              dir="$(dirname "${abs}")"
            fi
            case ":${paths}:" in
              *":${dir}:"*) ;;
              *) paths="${paths:+${paths}:}${dir}" ;;
            esac
          done <<< "${INCLUDE}"
          if [ -n "${paths}" ]; then
            echo "SHELLCHECK_OPTS=-P ${paths}" >> "$GITHUB_ENV"
          fi

      - name: Dry-run summary (installs verified, checks skipped)
        if: ${{ inputs.dry_run }}
        run: echo "dry-run summary -- mise, language-tools ${{ env.LANGUAGE_TOOLS_VERSION }} and shellcheck/shfmt/bats-core/semgrep/jq/checkbashisms/kcov installed and verified, the checks steps and extra_steps are skipped"

      - name: language-tools format
        if: ${{ !inputs.dry_run }}
        run: language-tools format --language shell --dir "${{ inputs.script_root }}" --log-dir "${{ github.workspace }}/.language-tools/log"

      - name: language-tools lint
        if: ${{ !inputs.dry_run }}
        run: language-tools lint --language shell --dir "${{ inputs.script_root }}" --log-dir "${{ github.workspace }}/.language-tools/log"

      - name: language-tools security
        if: ${{ !inputs.dry_run }}
        run: language-tools security --language shell --dir "${{ inputs.script_root }}" --log-dir "${{ github.workspace }}/.language-tools/log"

      - name: language-tools test unit
        if: ${{ !inputs.dry_run }}
        run: language-tools test unit --language shell --dir "${{ inputs.script_root }}" --log-dir "${{ github.workspace }}/.language-tools/log" --timeout "${{ inputs.test_timeout }}s"

      - name: language-tools test e2e
        if: ${{ !inputs.dry_run }}
        run: language-tools test e2e --language shell --dir "${{ inputs.script_root }}" --log-dir "${{ github.workspace }}/.language-tools/log" --timeout "${{ inputs.test_timeout }}s"

      - name: Extra steps (repository-specific checks language-tools doesn't cover)
        if: ${{ !inputs.dry_run && inputs.extra_steps != '' }}
        run: ${{ inputs.extra_steps }}

      # Failure-path capture (contract section 10): export the per-check records a
      # failed check wrote under .language-tools/log so a gate_negative.toolchain.error
      # travels with the run instead of needing a local re-probe. Changes no check's
      # invocation, target root, subject set or verdict.
      - name: Capture language-tools logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: language-tools-logs-shell-checks
          path: ${{ github.workspace }}/.language-tools/log/
          if-no-files-found: ignore
