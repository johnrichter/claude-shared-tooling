# Reusable SC-DISTRIBUTION release template — CLI track. Fleet-wide: any repository's
# workflow may call this, not only ai-shared-lib's own modules (the original scope this file
# shipped with). Calling it now requires two things a pre-mise caller of this file never
# needed: a mise.toml + mise.lock at the caller's checked-out repo root pinning a Go toolchain,
# and network access to fetch a pinned language-tools release — the cross-compile `go build`
# this file used to run directly took neither dependency.
#
# A CLI releases as per-OS/arch archives + two checksum manifests, attached to the official
# platform release; nothing is committed to git for this (dist-guard, tooling/dist-guard/,
# enforces that). A plugin-side download-script fetches the pinned version and verifies the
# checksum before ever running the binary.
#
# Shares ci-go.yml's canonical preamble (mise pin, verified fetch, platform resolution) up
# through installing language-tools, byte-for-byte; a change to that shared shape belongs in
# ci-go.yml first, then copies here. It departs from the CI templates' preamble in three ways,
# all release-track, not check-track:
#   - There are no five language-tools checks to skip, so there is no dry_run-gated
#     "checks skipped" step; the build/archive/manifest work below runs the same whether
#     dry_run is set or not (only the tag push and the platform release skip it — see below).
#   - No extra_steps escape hatch and no cross-repository sibling-checkout input: those exist
#     on the CI templates for a repository-specific check or a private-module resolution
#     problem, neither of which a single release-build invocation has.
#   - `language-tools release build` (cmd/release.go) itself cross-compiles every target in
#     one call, so this template needs no per-cell build matrix — the four-cell GOOS/GOARCH
#     fan-out that used to live in `strategy.matrix` now lives inside that one command.
#
# `language-tools release build` replaces the cross-compile `go build` this file ran directly
# before — the one documented exception to the fleet's banned-check-command list, since a
# release build is not a check. It writes archives plus checksums.txt (one row per archive)
# and binary-checksums.txt (one row per extracted binary) straight to --output-dir; this
# template publishes exactly those three kinds of asset, replacing the per-archive .sha256
# files and the combined SHA256SUMS this file used to produce and publish instead.
#
# GitLab equivalent: the same `language-tools release build` call + a `release-cli create`
# job attaching its output. No separate GitLab template exists in this repo; this file is the
# GitHub Actions implementation of the SC-DISTRIBUTION CLI contract.

name: SC-DISTRIBUTION release (CLI)

on:
  workflow_call:
    inputs:
      version:
        description: "Tag to cut, e.g. lang/example-cli/v1.2.3 (SC-VERSIONING: tag prefix == module path)."
        required: true
        type: string
      module_dir:
        description: "Go module directory the CLI builds from, relative to the checked-out repo (language-tools' --module-dir)."
        required: true
        type: string
      binary_name:
        description: "Output binary name (e.g. example-cli); built from module_dir's root package."
        required: true
        type: string
      runs_on:
        description: "Fully qualified GitHub-hosted runner label (actions/runner-images). Never a floating tag."
        required: false
        type: string
        default: "ubuntu-24.04"
      mise_version:
        description: "mise release to install. Every committed mise.lock in the fleet was written by this version."
        required: false
        type: string
        default: "2026.8.10"
      dry_run:
        description: "Build archives, checksums.txt, and binary-checksums.txt as usual; skip the tag push and the platform release."
        required: false
        type: boolean
        default: false
    secrets:
      GH_TOKEN:
        description: "Token with contents:write, for `gh release create`. Unused in dry-run."
        required: false

env:
  # Named once; every step below reads this instead of restating the version.
  LANGUAGE_TOOLS_VERSION: "2.1.0"

permissions:
  contents: write

jobs:
  build:
    name: build
    runs-on: ${{ inputs.runs_on }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # mise and language-tools name platforms differently (mise: linux/macos, x64/arm64;
      # language-tools: Go's own linux/darwin, amd64/arm64) — resolve both once, here.
      - name: Resolve runner platform
        id: platform
        run: |
          mkdir -p "${RUNNER_TEMP}/bin"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
          case "$(uname -s)" in
            Linux)  mise_os=linux;  lt_os=linux  ;;
            Darwin) mise_os=macos;  lt_os=darwin ;;
            *) echo "::error::unsupported runner OS $(uname -s)"; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64)  mise_arch=x64;   lt_arch=amd64 ;;
            arm64|aarch64) mise_arch=arm64; lt_arch=arm64 ;;
            *) echo "::error::unsupported runner arch $(uname -m)"; exit 1 ;;
          esac
          {
            echo "mise_os=${mise_os}"
            echo "mise_arch=${mise_arch}"
            echo "lt_os=${lt_os}"
            echo "lt_arch=${lt_arch}"
          } >> "$GITHUB_OUTPUT"

      # Verified fetch (SC1 shape): fetch the release's own published checksum manifest,
      # look up this artifact's digest by exact filename match, then fetch the artifact and
      # fail closed on any mismatch. Never pipes a download into a shell.
      - name: Install mise ${{ inputs.mise_version }} (verified fetch)
        env:
          MISE_VERSION: ${{ inputs.mise_version }}
          MISE_OS: ${{ steps.platform.outputs.mise_os }}
          MISE_ARCH: ${{ steps.platform.outputs.mise_arch }}
        run: |
          set -euo pipefail
          bin="mise-v${MISE_VERSION}-${MISE_OS}-${MISE_ARCH}"
          base="https://github.com/jdx/mise/releases/download/v${MISE_VERSION}"
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/SHASUMS256.txt" "${base}/SHASUMS256.txt"
          curl -fsSL -o "${tmp}/${bin}" "${base}/${bin}"
          expected="$(awk -v want="./${bin}" '$2 == want { print $1; exit }' "${tmp}/SHASUMS256.txt")"
          if [ -z "${expected}" ]; then
            echo "::error::${bin} not listed in SHASUMS256.txt for mise v${MISE_VERSION}"
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${tmp}/${bin}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "${tmp}/${bin}" | awk '{print $1}')"
          fi
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::sha256 mismatch for ${bin} -- expected ${expected}, got ${actual}"
            exit 1
          fi
          install -m 0755 "${tmp}/${bin}" "${RUNNER_TEMP}/bin/mise"
          rm -rf "${tmp}"

      - name: mise install --locked
        run: mise install --locked

      - name: Install language-tools ${{ env.LANGUAGE_TOOLS_VERSION }} (verified fetch)
        env:
          LT_OS: ${{ steps.platform.outputs.lt_os }}
          LT_ARCH: ${{ steps.platform.outputs.lt_arch }}
        run: |
          set -euo pipefail
          archive="language-tools_${LANGUAGE_TOOLS_VERSION}_${LT_OS}_${LT_ARCH}.tar.gz"
          base="https://github.com/johnrichter/language-tools/releases/download/v${LANGUAGE_TOOLS_VERSION}"
          tmp="$(mktemp -d)"
          curl -fsSL -o "${tmp}/checksums.txt" "${base}/checksums.txt"
          curl -fsSL -o "${tmp}/${archive}" "${base}/${archive}"
          expected="$(awk -v want="${archive}" '$2 == want { print $1; exit }' "${tmp}/checksums.txt")"
          if [ -z "${expected}" ]; then
            echo "::error::${archive} not listed in checksums.txt for language-tools v${LANGUAGE_TOOLS_VERSION}"
            exit 1
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "${tmp}/${archive}" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "${tmp}/${archive}" | awk '{print $1}')"
          fi
          if [ "${expected}" != "${actual}" ]; then
            echo "::error::sha256 mismatch for ${archive} -- expected ${expected}, got ${actual}"
            exit 1
          fi
          tar -xzf "${tmp}/${archive}" -C "${tmp}"
          install -m 0755 "${tmp}/language-tools" "${RUNNER_TEMP}/bin/language-tools"
          rm -rf "${tmp}"

      # Cross-compiles every default GOOS/GOARCH cell in one call and writes checksums.txt +
      # binary-checksums.txt alongside the archives — no per-cell matrix, no separate archive
      # or checksum step. Runs unconditionally: dry_run only gates the tag push and the
      # platform release below, never this build. Inputs pass through env, never interpolated
      # into the shell.
      - name: language-tools release build
        env:
          MODULE_DIR: ${{ inputs.module_dir }}
          BINARY_NAME: ${{ inputs.binary_name }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ver="${VERSION##*/}"
          ver="${ver#v}"
          language-tools release build \
            --module-dir "${MODULE_DIR}" \
            --output-dir "${{ github.workspace }}/dist" \
            --binary "${BINARY_NAME}:." \
            --version "${ver}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error

  publish:
    name: tag-and-release
    needs: build
    runs-on: ${{ inputs.runs_on }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist
          path: dist

      - name: Reject an existing tag (no overwrite)
        run: |
          if git rev-parse "${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::tag ${{ inputs.version }} already exists - a release tag is never reused"
            exit 1
          fi

      - name: Tag HEAD
        if: ${{ !inputs.dry_run }}
        run: |
          git tag -a "${{ inputs.version }}" -m "${{ inputs.version }}"
          git push origin "${{ inputs.version }}"

      - name: Publish the official release (archives + checksums.txt + binary-checksums.txt)
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: gh release create "${{ inputs.version }}" --title "${{ inputs.version }}" --generate-notes dist/*.tar.gz dist/checksums.txt dist/binary-checksums.txt

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "dry-run: built archives, checksums.txt, and binary-checksums.txt for ${{ inputs.version }}, tag push and platform release skipped"
          ls -la dist
