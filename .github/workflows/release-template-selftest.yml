# Proves the SC-DISTRIBUTION library release template actually builds: dry-runs
# release-library.yml on every change to a release template or dist-guard, and on demand.
# dry_run: true skips the tag push and the platform release — this only exercises the
# build/archive/checksum stage, so it needs no release credentials.

name: SC-DISTRIBUTION release template self-test

on:
  pull_request:
    paths:
      - ".github/workflows/release-*.yml"
      - "tooling/dist-guard/**"
  workflow_dispatch: {}

jobs:
  dry-run-library-release:
    uses: ./.github/workflows/release-library.yml
    with:
      version: dry-run-lib-${{ github.run_id }}
      dry_run: true
